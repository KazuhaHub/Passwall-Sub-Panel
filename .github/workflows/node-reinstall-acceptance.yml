name: Node reinstall systemd acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/adapters/noderelease/**'
      # The installer this case installs from is a release asset the panel reads
      # through these two, so a change in either changes what is under test.
      - 'internal/adapters/pninstall/**'
      - 'internal/pkg/releaseasset/**'
      - 'internal/pkg/nodebootstrap/**'
      - 'internal/pkg/operationgate/**'
      - 'internal/transport/http/handler/node_bootstrap*'
      - 'internal/adapters/sqlstore/server_migration*'
      - 'tests/acceptance/node-reinstall-systemd/**'
      - '.github/workflows/node-reinstall-acceptance.yml'
      - '.github/workflows/test.yml'
      - 'web-react/scripts/reinstall-browser.mjs'
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'internal/adapters/noderelease/**'
      # The installer this case installs from is a release asset the panel reads
      # through these two, so a change in either changes what is under test.
      - 'internal/adapters/pninstall/**'
      - 'internal/pkg/releaseasset/**'
      - 'internal/pkg/nodebootstrap/**'
      - 'internal/pkg/operationgate/**'
      - 'internal/transport/http/handler/node_bootstrap*'
      - 'internal/adapters/sqlstore/server_migration*'
      - 'tests/acceptance/node-reinstall-systemd/**'
      - '.github/workflows/node-reinstall-acceptance.yml'
      - '.github/workflows/test.yml'
      - 'web-react/scripts/reinstall-browser.mjs'

permissions:
  contents: read

concurrency:
  group: node-reinstall-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  systemd:
    name: Ubuntu 24.04 / published Node beta4
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
      - name: Install fixture prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends sqlite3 gcc
      - name: Build isolated acceptance driver
        env:
          GOWORK: 'off'
          GOTOOLCHAIN: go1.26.8
        run: |
          test "$(go env GOVERSION)" = go1.26.8
          go test -c -tags node_reinstall_acceptance -o "$RUNNER_TEMP/node-reinstall-acceptance.test" ./tests/acceptance/node-reinstall-systemd
      # THE RELEASE THE CASE INSTALLS FROM IS CHECKED BEFORE THE CASE RUNS.
      #
      # The acceptance below proves an installation works; these prove the RELEASE
      # publishes what every install path reads — the template an operator's script
      # is rendered from, the reviewed core catalog the panel offers cores from, and
      # the release's presence in the list an operator selects from. Without them a
      # release that dropped an asset would be discovered by the twenty-minute
      # systemd case, or by nobody.
      #
      # THE TAG COMES FROM THE CASE'S OWN PIN, so there is one source of truth for
      # which release is under test. A pattern that stops matching fails here rather
      # than silently checking nothing.
      - name: The pinned release publishes what the panel reads
        env:
          GOWORK: 'off'
          GOTOOLCHAIN: go1.26.8
        run: |
          set -euo pipefail
          pinned=$(grep -oE 'nodeVersion += "[0-9][0-9.]*"' tests/acceptance/node-reinstall-systemd/acceptance_linux_test.go | head -1 | cut -d'"' -f2)
          test -n "$pinned"
          echo "checking release/$pinned"
          PSP_LIVE_NODE_RELEASE="release/$pinned" go test -count=1 \
            ./internal/adapters/noderelease/ ./internal/adapters/pninstall/ ./internal/adapters/corecatalogdoc/ \
            -run '^TestLive'
      - name: Run actual systemd acceptance (no production host)
        env:
          PSP_NODE_REINSTALL_EPHEMERAL: 'yes'
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,PSP_NODE_REINSTALL_EPHEMERAL \
            "$RUNNER_TEMP/node-reinstall-acceptance.test" -test.v -test.run '^TestDisposableSystemdNodeReinstall$' -test.timeout 24m \
            2>&1 | tee "$RUNNER_TEMP/node-reinstall-acceptance.log"
          test "$(grep -c '^--- PASS: TestDisposableSystemdNodeReinstall ' "$RUNNER_TEMP/node-reinstall-acceptance.log")" = 1
          ! grep -q -- '--- SKIP:' "$RUNNER_TEMP/node-reinstall-acceptance.log"
      - name: Retain bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-reinstall-systemd-evidence
          path: ${{ runner.temp }}/node-reinstall-acceptance.log
          if-no-files-found: error
          retention-days: 14
