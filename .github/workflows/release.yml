name: Release

# Single pipeline that produces both the GitHub Release archives and the
# ghcr.io multi-arch container image from one set of binaries. The previous
# split-workflow setup compiled the web bundle three times (release + docker
# amd64 + docker arm64 under QEMU) and the linux binaries four times. Here:
#
#   web         → builds the SPA once
#   build       → cross-compiles 6 platforms natively in parallel (matrix)
#   release     → packages tarballs/zips + checksums and publishes the Release
#   docker      → reuses the linux/amd64 + linux/arm64 binaries to push a
#                 multi-arch image (no compilation inside the container build)
#
# The binary you sha256-verify from the Release is byte-identical to the one
# baked into the Docker image, because they come from the same artifact.

on:
  push:
    tags:
      # ONE SCHEME. `release/*` is the shape this project publishes; the v-prefixed
      # trigger went with the scheme it belonged to, because a workflow that can
      # still cut a v-named release is a way to publish one the panel cannot read
      # (release/MAJOR.MINOR.PATCH).
      #
      # IT WAS WITHHELD UNTIL THE READING SIDE CAUGHT UP, because a product
      # release's TAG is not its VERSION — `release/4.0.0` names the release
      # `4.0.0` — and two consumers of a published release read the tag as the
      # version: the public Node installer, and PSP's own cmd/compatwatch, which
      # reconciles the Node repo's releases against the reviewed set in
      # docs/compat/passwall-node-v4.json.
      #
      # Both now handle both identities: the installer takes the version out of
      # the asset name and the address out of the release document
      # (Passwall-Node#40), and compatwatch parses the tag into a version before
      # reconciling it (#183). That is the condition this trigger was waiting on,
      # and deploy/release_workflow_test.mjs was rewritten to REQUIRE the pattern
      # in the same change rather than deleted.
      - "release/*"
  workflow_dispatch:
    inputs:
      tag:
        # BLANK CUTS THE NEXT ONE. The form is the normal release path; naming
        # the tag by hand is the exception, for a line's first release or for a
        # tag that already exists. See the `tag` job.
        description: "Release tag, for example release/4.0.0. Leave blank to cut the next one on the line."
        required: false
        type: string
      line:
        # A LINE'S FIRST RELEASE IS NAMED, NOT ALLOCATED, and nothing in a
        # repository knows whether the next release belongs on 4.0 or 4.1 — so
        # the person releasing names the line. Required only when the tag is
        # blank; ignored when the tag is given.
        description: "Release line, MAJOR.MINOR (for example 4.0). Required only when the tag is blank."
        required: false
        type: string
      notes:
        description: "Release notes, stored on the annotated tag. Defaults to a one-line title."
        required: false
        type: string
      channel:
        description: "Publication channel. auto reads it from the tag; stable and testing state it."
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - testing

env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"

# Publisher jobs never restore/save shared dependency caches. Their immutable
# checkout uses the trusted workflow SHA. Setup proves that this SHA equals
# the resolved release tag SHA; dispatch on a different ref is rejected.
# Ordinary PR CI caches are separate from uncached publication inputs.

permissions:
  contents: read

# Serialize publishers, including rolling-channel updates. Do not cancel an
# in-flight upload and then silently replace that version from another run.
concurrency:
  group: release-passwall-sub-panel
  cancel-in-progress: false

jobs:
  # THE TAG IS CUT HERE, NOT ON SOMEBODY'S LAPTOP.
  #
  # The release is one dispatch against the latest tested main commit, and this
  # job creates the annotated tag once that commit has passed the test suite. A
  # hand-pushed tag is still accepted (the `push` trigger above), so this adds a
  # path rather than replacing one — but the hand-pushed path is the exception.
  # Before this, the tag had to exist first and the run had to be dispatched FROM
  # it, so a fix to the release path itself cost a PR and a merge before a release
  # could run at all.
  tag:
    name: Cut the release tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOTHING TO CUT when a tag was pushed (that tag is the trigger) or when the
    # form named one. The job is the blank-tag path, and only that path.
    if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.cut.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: false

      # THE SAME GATE EVERY OTHER JOB HERE HAS. Setting up Go means verifying the
      # compiler the build will actually use, immediately and unconditionally —
      # TestPSPBuildBaselinesStayAligned enforces that pairing for every job in this
      # file, and it is what makes the toolchain in go.mod a fact rather than a
      # request. This job sets up Go to run the allocator, so it owes the same check.
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"

      - name: Refuse a commit the test suite has not passed
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # ASK ABOUT THE GATE, NOT ABOUT EVERY RUN ON THE COMMIT. Enumerating the
          # commit's check runs would include this very release run, still in
          # progress and therefore inconclusive, and the commit would be refused
          # for its own existence.
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow test.yml --commit "$SHA" --limit 1 \
            --json status,conclusion \
            --jq '.[] | select(.status == "completed") | .conclusion' | head -n 1)
          test "$conclusion" = "success" || {
            echo "the test suite has not succeeded on ${SHA:0:7} (conclusion: ${conclusion:-none})" >&2
            exit 1
          }

      - name: Allocate the next number on the line and create the tag
        id: cut
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RELEASE_LINE: ${{ inputs.line }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          line=${RELEASE_LINE:?name the release line, MAJOR.MINOR, when the tag is blank}
          # THE NUMBER COMES FROM THE PINNED ALLOCATOR, NOT FROM ARITHMETIC HERE.
          # "An incremental fix takes the fourth segment" and "a number, once
          # bound to a revision, is never reused" are one rule, and it lives in
          # Passwall Node's releaseid so that every consumer applies the same one.
          # `go run` resolves the module at the version go.mod pins, so this is
          # the allocator this repository was tested against, not today's main.
          all_tags() { git ls-remote --tags --refs origin | sed 's#.*refs/tags/##'; }
          tags_on_this_commit() {
            git ls-remote --tags origin | awk -v sha="$SHA" '$1 == sha { sub("^refs/tags/", "", $2); print $2 }'
          }
          note=${NOTES:-Passwall Sub Panel}
          # ALLOCATE, THEN CONFIRM WITH THE ATOMIC RESULT OF CREATING AN IMMUTABLE
          # TAG. `git push` refuses to move an existing ref, so losing that race is
          # how a second run finds out: it re-reads, resumes its own number when the
          # tag on the revision is its own, and otherwise allocates the one after.
          # Creating the tag is the only step that can decide a race, so the create
          # and the decision are the same step.
          attempt=0
          tag=
          while [ "$attempt" -lt 5 ]; do
            tag=$(go run github.com/KazuhaHub/passwall-node/deployment/cmd/allocate-release-tag \
              -line "$line" \
              -existing "$(all_tags | tr '\n' ',')" \
              -on-commit "$(tags_on_this_commit)")
            # A REFUSAL PRINTS NOTHING, so emptiness is the refusal. The first
            # release of a line is NAMED rather than derived — nothing in a
            # repository knows whether the next release belongs on 4.0 or 4.1 —
            # and it arrives through the tag input.
            test -n "$tag" || {
              echo "the allocator will not put a number on line $line; name the first release of a line in the tag input" >&2
              exit 1
            }
            # ANNOTATED AT CREATION, because the notes are the artefact a reader
            # opens and the only place a note survives a rerun. Writing it here
            # also keeps the push atomic: one ref, created once or not at all.
            git tag -a --cleanup=verbatim "$tag" -m "$note"
            if git push --quiet origin "refs/tags/$tag" 2>/dev/null; then
              break
            fi
            git tag -d "$tag" >/dev/null
            attempt=$((attempt + 1))
            tag=
          done
          test -n "$tag" || {
            echo "could not bind a release tag for ${SHA:0:7} on line $line after 5 attempts" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Cut the release tag $tag at ${SHA:0:7} on line $line." >> "$GITHUB_STEP_SUMMARY"

  setup:
    name: Resolve release identity
    # THE TAG JOB IS SKIPPED ON THE PATHS THAT DO NOT NEED IT — a pushed tag, or
    # a form that named one — and a skipped dependency skips its dependents
    # unless the condition says otherwise, which would have meant no release at
    # all. Only a tag job that FAILED stops the release.
    needs: tag
    if: always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      owner_lc: ${{ steps.identity.outputs.owner_lc }}
      sha: ${{ steps.identity.outputs.sha }}
      build_date: ${{ steps.identity.outputs.build_date }}
      node_cases: ${{ steps.node_support.outputs.node_cases }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      image_channel: ${{ steps.channel.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"

      - name: Resolve tag and owner
        id: identity
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          CUT_TAG: ${{ needs.tag.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # THREE WAYS IN, AND THEY ARE NOT INTERCHANGEABLE. A tag cut by this run
          # comes first: it is the one this run made and the reason the run exists.
          # A tag named on the form is next, and a pushed tag last, where the ref
          # that triggered the run IS the tag.
          if [ -n "${CUT_TAG}" ]; then
            tag="$CUT_TAG"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$REQUESTED_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          test -n "$tag" || {
            echo 'no release tag: name one on the form, or name the line so one can be cut' >&2
            exit 1
          }
          # Use the pinned, published Node installer/publisher tag authority, not
          # a second PSP regex or an automatically resolved latest version. It
          # PRINTS THE VERSION, which for the legacy scheme is the tag itself and
          # for the product scheme is not: `release/4.0.0` names the release
          # `4.0.0`. Discarding that output — which is what this did — left the
          # tag standing in for the version everywhere downstream.
          #
          # It refuses an unpublishable tag, and the emptiness check is the belt
          # to its braces: an empty version reaching ldflags or an archive name is
          # a silently wrong artifact rather than a failure.
          version=$(go run github.com/KazuhaHub/passwall-node/deployment/cmd/release-tag "$tag")
          test -n "$version" || {
            echo 'the release tag produced no version' >&2
            exit 1
          }
          # A TAG THIS RUN CUT IS NOT IN GITHUB_REF, because the run was
          # dispatched from a branch rather than from the tag — so the ref check
          # cannot apply to it, and does not. What replaces it is the check below
          # and the one the tag job already made: the tag points at this commit,
          # and the commit's test suite passed.
          if [ -z "${CUT_TAG}" ]; then
            test "$GITHUB_REF" = "refs/tags/${tag}" || {
              echo 'select the exact release tag ref for dispatch' >&2
              exit 1
            }
          fi
          release_sha=$(git rev-parse --verify "refs/tags/${tag}^{commit}")
          test "$release_sha" = "$GITHUB_SHA" || {
            echo 'release tag does not identify this workflow commit' >&2
            exit 1
          }
          # API errors fail closed. A fresh run must not replace an existing
          # published release; failed jobs may retry within this run.
          export RELEASE_TAG="$tag"
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .id')
          test -z "$existing" || {
            echo 'this release already exists; use a new version' >&2
            exit 1
          }
          owner_lc=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          # WHICH IDENTITY GOES WHERE, because the two are the same string in the
          # legacy scheme and using one for the other is invisible until the
          # product scheme, where it is a different release:
          #
          #   tag     — the git ref, the release's tag_name and title, and the
          #             shape the publication channel is read from.
          #   version — the build stamp, the archive name, the exact image tag and
          #             the OCI version label.
          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "owner_lc=${owner_lc}"
            echo "sha=${release_sha}"
            echo "build_date=$(date -u +%FT%TZ)"
          } >> "$GITHUB_OUTPUT"

        # THE DEFAULT IS A PRE-RELEASE, STATED OR NOT. A release published without an
        # explicit channel goes out as one, because that is the direction a deliberate
        # promotion can correct and the one that cannot move `latest` or
        # /releases/latest — pointers consumers follow, which no later edit takes back.
        #
        # SO THE TAG TEXT NO LONGER DECIDES THE CHANNEL AT ALL. It used to:
        # `contains(tag, '-')` read a hyphen as pre-release and a plain `v*` as STABLE.
        # That made a v-tag the one publishable mistake with an unrecoverable half, and
        # it is the same legacy shape rule the product scheme had to be exempted from.
        # Publishing stable is now something a maintainer states through the input.
        #
        # The tag is still read for one thing — whether it addresses a release at all,
        # in the image-channel case — and that is about the ADDRESS, not the channel.
      - name: Resolve the publication channel
        id: channel
        env:
          REQUESTED: ${{ inputs.channel }}
          PINNED_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          case "${REQUESTED:-auto}" in
            stable)  prerelease=false ;;
            testing) prerelease=true ;;
            auto)    prerelease=true ;;
            *) echo "unknown publication channel: ${REQUESTED}" >&2; exit 1 ;;
          esac
          case "$PINNED_TAG" in
            v*|release/*) images=true ;;
            *)            images=false ;;
          esac
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "images=${images}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for immutable image preflight
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Test fail-closed publication guards
        run: node --test deploy/check_image_test.mjs deploy/check_build_test.mjs deploy/release_workflow_test.mjs deploy/compat/plan.test.mjs deploy/compat/check-case-set.test.mjs deploy/compat/evidence-index.test.mjs deploy/test_workflow_test.mjs

      - name: Refuse an already published exact image tag
        env:
          IMAGE_OWNER: ${{ steps.identity.outputs.owner_lc }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: node deploy/check-image.mjs "${IMAGE_OWNER}/passwall-sub-panel" "$RELEASE_VERSION"

      # THE PLAN, NOT A LIST. The supported versions come from the manifest by
      # position at min_supported, and each one carries the commit its tag
      # resolved to when it was first pinned. The release gate used to carry its
      # own copy of every released version, so a release had to be added here as
      # well as in test.yml and the manifest.
      - name: Resolve the compatible Node cases
        id: node_support
        shell: bash
        run: |
          set -euo pipefail
          # Emitted as JSON and read by the matrix as structure, never
          # interpolated into a shell command: a name that drifted could
          # otherwise turn into an argument.
          cases=$(node deploy/compat/plan.mjs --emit cases)
          test "$cases" != "[]"
          echo "planned cases: $(echo "$cases" | python3 -c 'import json,sys;print(" ".join(c["id"] for c in json.load(sys.stdin)))')"
          echo "node_cases=$cases" >> "$GITHUB_OUTPUT"

  node-compatibility:
    name: Released Node compatibility (${{ matrix.node_case.version }})
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The plan, so each leg carries BOTH the label to check out and the commit
      # that label must still resolve to.
      matrix:
        node_case: ${{ fromJSON(needs.setup.outputs.node_cases) }}
    steps:
      - name: Checkout trusted panel source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Checkout released Passwall Node
        uses: actions/checkout@v7
        with:
          repository: KazuhaHub/Passwall-Node
          # BY TAG, BECAUSE A VERSION IS NOT A GIT REF. The release lives at
          # refs/tags/release/4.0.0 and is named 4.0.0, so asking git to resolve
          # the version fails outright — the job dies before it records anything,
          # and the failure surfaces two jobs away from this line. The planner
          # emits both fields; this one addresses the source and the version
          # names the build.
          ref: ${{ matrix.node_case.tag }}
          path: .compat/passwall-node
          persist-credentials: false
      - name: the tag still resolves to the commit the plan pinned
        env:
          EXPECTED: ${{ matrix.node_case.sha }}
        run: |
          set -euo pipefail
          resolved=$(git -C .compat/passwall-node rev-parse HEAD)
          # A TAG IS A LABEL, NOT AN IDENTITY. If it was moved, the leg would
          # otherwise test a different commit from the one the policy was
          # verified against while still reporting the same version — the one
          # substitution this matrix cannot afford to make silently.
          if [ "$resolved" != "$EXPECTED" ]; then
            echo "::error::${{ matrix.node_case.version }} now resolves to $resolved, but the plan pinned $EXPECTED. A tag moved; re-verify before re-pinning."
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@v7
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - name: Exercise the released wire contract
        env:
          PSP_LIVE_NODE_REPO: ${{ github.workspace }}/.compat/passwall-node
        run: |
          set -euo pipefail
          # The evidence directory is named for the CASE, not for the job. The
          # summary gate derives the expected set and looks each case up by name,
          # so evidence filed under any other name reads as a case that never
          # reported — which is exactly what a cancelled leg looks like.
          case_id='node-wire-v1@${{ matrix.node_case.version }}'
          evidence="evidence/$case_id"
          mkdir -p "$evidence"
          # The exit code is CAPTURED rather than allowed to end the step, so the
          # validator still runs and reports WHICH required item did not pass —
          # see the same guard in test.yml. stderr stays in its own file so a
          # panic or a build error cannot leak into the JSON stream.
          test_exit=0
          go test -json -count=1 -timeout=5m ./internal/service/nodesync \
            -run '^TestLive_RealNode(AgentContract|MigratedServerContract|TaskEvidenceReceipt|TaskExpiryContract)$' \
            > "$evidence/go-events.jsonl" 2> "$evidence/go-stderr.txt" || test_exit=$?
          # Judged against the profile, never against the run's own exit code: a
          # green `go test` with `-run` matching nothing is still no coverage,
          # and this job's whole value is that it exercised the released tag.
          node deploy/compat/check-go-results.mjs \
            --profile node-wire-v1 \
            --input "$evidence/go-events.jsonl" \
            --go-exit-code "$test_exit" \
            --output "$evidence/result.json"
      - name: record the case environment
        if: always()
        env:
          PSP_SHA: ${{ github.sha }}
          NODE_VERSION: ${{ matrix.node_case.version }}
        run: |
          set -euo pipefail
          case_id="node-wire-v1@$NODE_VERSION"
          evidence="evidence/$case_id"
          mkdir -p "$evidence"
          # WHICH two implementations produced this result, and where. A report
          # that cannot name its inputs cannot be re-checked, and this job's
          # matrix resolves the tag at run time rather than pinning a commit.
          node_sha=$(git -C .compat/passwall-node rev-parse HEAD)
          cat > "$evidence/environment.json" <<JSON
          {
            "case": "$case_id",
            "profile": "node-wire-v1",
            "psp_sha": "$PSP_SHA",
            "node_version": "$NODE_VERSION",
            "node_sha": "$node_sha",
            "runner_os": "$RUNNER_OS",
            "runner_arch": "$RUNNER_ARCH",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}"
          }
          JSON
          cat "$evidence/environment.json"
      - name: upload case evidence
        # Uploaded whatever the verdict was. A report is only useful when it can
        # be read after a failure, and a failure is the only time anybody looks.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-wire-v1@${{ matrix.node_case.version }}
          path: evidence/node-wire-v1@${{ matrix.node_case.version }}/
          if-no-files-found: error
          retention-days: 90

  # THE SUMMARY GATE. A matrix reports as several checks, so a leg that was
  # cancelled leaves the others green and the run "passes" with a version
  # untested. This collapses them into ONE verdict that knows the expected case
  # set — and every publishing job below depends on it rather than on the
  # matrix, so there is no path to a release that skips the question.
  compatibility:
    name: compatibility gate
    runs-on: ubuntu-latest
    # `build` is here because the gate now gathers the artifact digests the build
    # legs emit; without the edge it could run first and find none. The build
    # itself does not depend on the gate, so this adds no cycle — and `release`
    # and `docker` still reach this job, never the matrix, which is what keeps
    # the gate the only way to publish.
    needs: [node-compatibility, build]
    # always(), so a failed or cancelled leg still produces a verdict. A skipped
    # gate reports as an absent check, which reads as "not run" rather than
    # "failed" — and an absent required check blocks nothing on a branch that
    # never had it.
    if: always()
    permissions:
      contents: read
    steps:
      - name: Checkout trusted panel source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Download every case report
        uses: actions/download-artifact@v7
        with:
          path: evidence
      - name: the matrix leg itself succeeded
        env:
          LEG: ${{ needs.node-compatibility.result }}
        run: |
          # The case-set check below would also notice a cancelled leg, but it
          # would report it as a pile of missing cases. Naming the cause first
          # keeps the failure readable.
          test "$LEG" = success
      - name: every expected case reported a pass
        run: |
          set -euo pipefail
          node deploy/compat/check-case-set.mjs --reports evidence --output case-set.json
      - name: gather the artifact digests the index will name
        run: |
          set -euo pipefail
          # THE GATE READS THIS FILE AND NOTHING PRODUCED IT. Every release since
          # this step was written would have failed here — the index step asked
          # for `.compat/digests.json`, the build job uploaded only binaries, and
          # the reference was to a path that never existed. It went unnoticed
          # because the release path had not been executed since; the first run
          # found it, which is what the first run is for.
          #
          # The digests arrive as one small artifact per build leg. Collected
          # here rather than re-derived, so the index names what the build job
          # measured and not a copy of it.
          mkdir -p .compat
          node -e '
            const fs = require("fs");
            const path = require("path");
            const digests = {};
            for (const entry of fs.readdirSync("evidence")) {
              if (!entry.startsWith("compat-digest-")) continue;
              const dir = path.join("evidence", entry);
              for (const file of fs.readdirSync(dir)) {
                const [sha, name] = fs.readFileSync(path.join(dir, file), "utf8").trim().split(/\s+/);
                digests[name] = sha;
              }
            }
            if (Object.keys(digests).length === 0) {
              console.error("no artifact digests were downloaded; the build legs uploaded none");
              process.exit(1);
            }
            fs.writeFileSync(".compat/digests.json", JSON.stringify(digests, null, 2) + "\n");
            console.log("recorded", Object.keys(digests).length, "artifact digests:", Object.keys(digests).sort().join(", "));
          '

      # THE EVIDENCE INDEX. The report above answers "may this run publish"; this
      # records WHAT was claimed, by which source, against which artifacts, so the
      # claim can still be read once the run's logs have expired. It runs after
      # the gate, not instead of it: the gate decides, this records.
      - name: assemble the evidence index
        run: |
          set -euo pipefail
          # The digests of the exact archives and images this release would
          # publish, taken from the build job's own output rather than re-derived.
          # The case manifest comes from the planner, not from the reports: the
          # index has to say what was CLAIMED as well as what came back.
          node deploy/compat/plan.mjs --output plan.json
          node deploy/compat/evidence-index.mjs \
            --evidence evidence \
            --plan plan.json \
            --digests "${{ github.workspace }}/.compat/digests.json" \
            --source-sha "${{ github.sha }}" \
            --output evidence-index.json
      - name: upload the evidence index
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-evidence-index
          path: evidence-index.json
          if-no-files-found: warn
          retention-days: 90
      - name: upload the case-set verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-gate-summary
          path: case-set.json
          if-no-files-found: warn
          retention-days: 90

  web:
    name: Build web assets
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install dependencies
        working-directory: web-react
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build SPA bundle
        working-directory: web-react
        # vite.config.ts writes to ../internal/web/dist for //go:embed.
        run: npm run build

      - name: Production browser smoke
        working-directory: web-react
        run: npm run smoke:dist

      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: internal/web/dist
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [setup, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64, ext: ""     }
          - { goos: linux,   goarch: arm64, ext: ""     }
          - { goos: darwin,  goarch: amd64, ext: ""     }
          - { goos: darwin,  goarch: arm64, ext: ""     }
          - { goos: windows, goarch: amd64, ext: ".exe" }
          - { goos: windows, goarch: arm64, ext: ".exe" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"

      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/web/dist

      - name: Build psp
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ needs.setup.outputs.version }}
          COMMIT: ${{ needs.setup.outputs.sha }}
          BUILD_DATE: ${{ needs.setup.outputs.build_date }}
        run: |
          set -euo pipefail
          mkdir -p out
          short_sha="${COMMIT:0:7}"
          ldflags="-s -w"
          ldflags+=" -X github.com/KazuhaHub/passwall-sub-panel/internal/version.Version=${VERSION}"
          ldflags+=" -X github.com/KazuhaHub/passwall-sub-panel/internal/version.Commit=${short_sha}"
          ldflags+=" -X github.com/KazuhaHub/passwall-sub-panel/internal/version.BuildDate=${BUILD_DATE}"
          go build -trimpath -ldflags="${ldflags}" -o "out/psp${{ matrix.ext }}" ./cmd/panel
          sh deploy/check-build.sh "out/psp${{ matrix.ext }}" "$GOOS" "$GOARCH" "$COMMIT"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: psp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: out/psp${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 1

      - name: Record the artifact digest
        shell: bash
        run: |
          set -euo pipefail
          # THE DIGESTS COME FROM THE JOB THAT PRODUCED THE BYTES. The evidence
          # index records which artifacts a claim was tested against, and the
          # only honest source for that is the build that made them — deriving
          # them again downstream would record a copy, not the artifact.
          #
          # It is emitted HERE rather than assembled later because the gate runs
          # BEFORE the archives exist: packaging happens in the release job,
          # which the gate itself gates. So the index names the binaries the
          # archives will be built from, which is the strongest statement
          # available at the point the decision is taken.
          mkdir -p .compat
          digest=$(sha256sum "out/psp${{ matrix.ext }}" | cut -d' ' -f1)
          printf '%s  %s\n' "$digest" "psp-${{ matrix.goos }}-${{ matrix.goarch }}" \
            > ".compat/digest-${{ matrix.goos }}-${{ matrix.goarch }}.txt"

      - name: Upload artifact digest
        uses: actions/upload-artifact@v7
        with:
          name: compat-digest-${{ matrix.goos }}-${{ matrix.goarch }}
          path: .compat/digest-${{ matrix.goos }}-${{ matrix.goarch }}.txt
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # Through the GATE, never straight onto the matrix: the gate is the only job
    # that knows whether the whole case set reported, so reaching around it
    # would let a release publish on a run where a version went untested.
    needs: [setup, build, compatibility]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: psp-*

      - name: Package archives
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist build

          set -- artifacts/psp-*
          test "$#" = 6 || { echo 'require exactly six release artifacts' >&2; exit 1; }

          for dir in artifacts/psp-*; do
            name_part="${dir#artifacts/psp-}"      # e.g. linux-amd64
            goos="${name_part%-*}"
            goarch="${name_part##*-}"

            pkgname="passwall-sub-panel_${VERSION}_${goos}_${goarch}"
            pkgdir="build/${pkgname}"
            mkdir -p "${pkgdir}/config"

            ext=""
            if [ "${goos}" = "windows" ]; then
              ext=".exe"
            fi

            cp "${dir}/psp${ext}" "${pkgdir}/psp${ext}"
            chmod +x "${pkgdir}/psp${ext}" || true

            # README + example config are tracked — copy without swallowing
            # errors so a genuinely missing file fails the release loudly.
            cp LICENSE README.md "${pkgdir}/"
            cp config/config.yaml.example "${pkgdir}/"
            # Bundle DEFAULT rulesets/templates from the committed seed dir.
            # config/templates and config/rulesets are git-ignored (runtime,
            # absent on a clean checkout), so copying from there silently
            # shipped archives WITHOUT defaults. internal/seed/files/ is the
            # same source the binary embeds and releases on first boot.
            cp -R internal/seed/files/templates "${pkgdir}/config/"
            cp -R internal/seed/files/rulesets  "${pkgdir}/config/"

            if [ "${goos}" = "windows" ]; then
              (cd build && zip -qr "../dist/${pkgname}.zip" "${pkgname}")
            else
              tar -C build -czf "dist/${pkgname}.tar.gz" "${pkgname}"
            fi
          done

          (cd dist && sha256sum -- * > SHA256SUMS.txt)

      - name: Generate release body
        shell: bash
        env:
          VERSION: ${{ needs.setup.outputs.version }}
          PRERELEASE: ${{ needs.setup.outputs.prerelease }}
          OWNER_LC: ${{ needs.setup.outputs.owner_lc }}
        run: |
          set -euo pipefail
          # The :latest tag is pushed for STABLE releases only (see the docker
          # job's metadata rules). Offering it in a pre-release's notes hands
          # the reader a command that silently installs the previous stable
          # image instead of the build they are looking at — the one failure
          # mode where following the instructions verbatim gets you the wrong
          # binary and no error. So a pre-release names its own tag, only.
          #
          # AND THE ANSWER COMES FROM setup, NOT FROM A HYPHEN IN THIS SCRIPT.
          # This tested `${VERSION}` for a hyphen, which is the legacy shape rule
          # living a second time in a place nobody would look for it: a product
          # version is three digits with no hyphen, so every testing candidate
          # would have been handed the `:latest` command above — this comment's
          # own failure mode, in the release it was written to protect.
          if [ "${PRERELEASE}" = "true" ]; then
            PULL_LINES="docker pull ghcr.io/${OWNER_LC}/passwall-sub-panel:${VERSION}"
          else
            PULL_LINES="docker pull ghcr.io/${OWNER_LC}/passwall-sub-panel:latest
          # Or specific version
          docker pull ghcr.io/${OWNER_LC}/passwall-sub-panel:${VERSION}"
          fi

          cat <<EOF > release_notes.md
          ### Docker image (ghcr.io)

          \`\`\`shell
          ${PULL_LINES}
          \`\`\`

          ### Verify

          \`\`\`shell
          sha256sum -c SHA256SUMS.txt
          \`\`\`
          EOF

          # A reviewed per-version note supplements generated commit notes.
          note="docs/releases/${VERSION}.md"
          if [ -f "$note" ]; then
            printf '\n' >> release_notes.md
            cat "$note" >> release_notes.md
          fi

      # THE TAG, NOT THE VERSION, and the variable says which. This looks up a
      # GIT REF, so binding it to the version would ask for `refs/tags/4.0.0` —
      # a ref that does not exist for a product release, and the failure would
      # read as "the tag changed during the build" rather than "wrong identity".
      - name: Recheck immutable tag before publication
        shell: bash
        env:
          TAG: ${{ needs.setup.outputs.tag }}
          COMMIT: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-parse --verify "refs/tags/${TAG}^{commit}")" = "$COMMIT" || {
            echo 'release tag changed during the build; refusing publication' >&2
            exit 1
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.setup.outputs.tag }}
          target_commitish: ${{ needs.setup.outputs.sha }}
          name: ${{ needs.setup.outputs.tag }}
          # Resolved once in setup, where the reason for each answer is written
          # down; both this job and the image job read that one answer.
          prerelease: ${{ needs.setup.outputs.prerelease }}
          generate_release_notes: true
          body_path: release_notes.md
          append_body: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publish container image
    runs-on: ubuntu-latest
    # Same reason as `release` above: a channel this job rolls forward must not
    # move on a run whose compatibility evidence is incomplete.
    needs: [setup, build, compatibility]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download linux/amd64 binary
        uses: actions/download-artifact@v8
        with:
          name: psp-linux-amd64
          path: bin/linux-amd64

      - name: Download linux/arm64 binary
        uses: actions/download-artifact@v8
        with:
          name: psp-linux-arm64
          path: bin/linux-arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Node.js for immutable image preflight
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ needs.setup.outputs.owner_lc }}/passwall-sub-panel
          tags: |
            # THE EXACT IMAGE TAG IS THE VERSION, NOT THE GIT TAG. A product tag
            # contains a slash, and a slash in a Docker tag is not rejected — it
            # is read as a REPOSITORY separator, so
            # `passwall-sub-panel:release/4.0.0` addresses a repository named
            # `passwall-sub-panel/release`. The build would succeed and push to
            # somewhere nobody is watching.
            type=raw,value=${{ needs.setup.outputs.version }}
            # Two rolling channels:
            #   :latest → newest STABLE only. Mirrors GitHub /releases/latest and
            #             PSP's in-app self-update nudge, so a :latest deploy never
            #             sees a pre-release.
            #   :beta   → the leading edge. Applied to EVERY release (pre-release
            #             AND stable), so it always points at the most recent
            #             build. A :beta deploy therefore auto-rolls forward onto a
            #             stable once that stable is the newest release, then onto
            #             the next beta — "always newest", not "betas only".
            type=raw,value=latest,enable=${{ needs.setup.outputs.image_channel == 'true' && needs.setup.outputs.prerelease == 'false' }}
            type=raw,value=beta,enable=${{ needs.setup.outputs.image_channel == 'true' }}
          labels: |
            org.opencontainers.image.title=passwall-sub-panel
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.setup.outputs.sha }}
            org.opencontainers.image.version=${{ needs.setup.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Recheck immutable tag before image publication
        shell: bash
        env:
          TAG: ${{ needs.setup.outputs.tag }}
          COMMIT: ${{ needs.setup.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --force --no-tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git rev-parse --verify "refs/tags/${TAG}^{commit}")" = "$COMMIT" || {
            echo 'release tag changed during the build; refusing image publication' >&2
            exit 1
          }

      - name: Refuse an already published exact image tag
        env:
          IMAGE_OWNER: ${{ needs.setup.outputs.owner_lc }}
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: node deploy/check-image.mjs "${IMAGE_OWNER}/passwall-sub-panel" "$RELEASE_VERSION"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          # No QEMU emulation needed: Dockerfile.release only COPYs the
          # pre-built per-arch binary; alpine itself is multi-arch.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
