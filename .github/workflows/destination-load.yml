            ${{ runner.temp }}/destination-block-overflow-metrics.json
          if-no-files-found: error
          retention-days: 7

  mixed-pressure:
    if: github.event_name != 'workflow_dispatch' || (inputs.suite || 'all') == 'all' || inputs.suite == 'mixed-pressure'
    name: four-class native overflow, frozen retries and recovery (${{ matrix.database }} / Xray 26.6.27)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {database: sqlite, evidence_prefix: native-destination-mixed-pressure}
          - {database: mysql, evidence_prefix: native-destination-mixed-pressure-mysql}
          - {database: postgres, evidence_prefix: native-destination-mixed-pressure-postgres}
    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: fixture-native-root-password
          MYSQL_DATABASE: psp_native_acceptance
          MYSQL_USER: psp
          MYSQL_PASSWORD: fixture-native-database-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pfixture-native-root-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: psp
          POSTGRES_PASSWORD: fixture-native-database-password
          POSTGRES_DB: psp_native_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psp -d psp_native_acceptance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
      - name: Verify exact preferred PSP compiler
        run: |
          set -euo pipefail
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - uses: actions/checkout@v7
        with:
          repository: KazuhaHub/Passwall-Node
          ref: 0614879497263defbda2bbcad6cdc81b3cdfd483
          path: node-source
      - name: Build immutable full-module Node with its own preferred compiler
        working-directory: node-source
        run: |
