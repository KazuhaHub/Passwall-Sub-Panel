name: Native destination load acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/app/**'
      - 'internal/service/destaudit/**'
      - 'internal/service/destpolicy/**'
      - 'internal/service/nodesync/**'
      - 'internal/adapters/sqlstore/dest*'
      - 'deploy/destination*'
      - '.github/workflows/destination-load.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'internal/app/**'
      - 'internal/service/destaudit/**'
      - 'internal/service/destpolicy/**'
      - 'internal/service/nodesync/**'
      - 'internal/adapters/sqlstore/dest*'
      - 'deploy/destination*'
      - '.github/workflows/destination-load.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

env:
  GOWORK: 'off'
  GOTOOLCHAIN: 'local'

concurrency:
  group: native-load-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  webhook-load:
    name: two five-minute real webhook loads (SQLite / Xray 26.6.27)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
      - name: Verify exact preferred PSP compiler
        run: |
          set -euo pipefail
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - uses: actions/checkout@v7
        with:
          repository: KazuhaHub/Passwall-Node
          ref: cef54ddba3ee96f9794aaacdc6ac1ed89cc318f9
          path: node-source
      - name: Build immutable full-module Node with its own preferred compiler
        working-directory: node-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cef54ddba3ee96f9794aaacdc6ac1ed89cc318f9
          toolchain=$(awk '$1 == "toolchain" { print $2; exit }' go.mod)
          test -n "$toolchain"
          test "$(GOTOOLCHAIN="$toolchain" go tool compile -V | awk '{ print $3 }')" = "$toolchain"
          GOTOOLCHAIN="$toolchain" CGO_ENABLED=0 go build -o "$RUNNER_TEMP/destination-node" ./cmd/node
      - name: Test evidence rejection and owned process counter boundaries
        run: |
          set -euo pipefail
          node --test deploy/destination_load_test.mjs
          go test -v -count=1 ./internal/app -run '^TestNativeLoadProcCountersRequireBirthAndExactCPUFields$'
          go test -c -tags destination_acceptance -o "$RUNNER_TEMP/destination-load.test" ./internal/app
      - name: Actual production App.Run, one rule and fifty rules at sustained delivery rate
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_REPOSITORY,RUNNER_ENVIRONMENT,RUNNER_TEMP \
            env PSP_NATIVE_NODE_BIN="$RUNNER_TEMP/destination-node" \
            PSP_NATIVE_CORE_VERSION=26.6.27 PSP_NATIVE_DB_KIND=sqlite \
            PSP_NATIVE_LOAD_METRICS="$RUNNER_TEMP/destination-load-metrics.json" \
            "$RUNNER_TEMP/destination-load.test" \
              -test.v=test2json -test.run '^TestNativeDestinationWebhookLoad$' -test.timeout=20m 2>&1 \
            | go tool test2json -t -p github.com/KazuhaHub/passwall-sub-panel/internal/app \
            | node deploy/destination-acceptance.mjs sanitize > "$RUNNER_TEMP/destination-load-tests.json"
          node deploy/destination-load.mjs "$RUNNER_TEMP/destination-load-tests.json" "$RUNNER_TEMP/destination-load-metrics.json"
      - name: Keep bounded count and resource evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-destination-load-${{ github.sha }}
          path: |
            ${{ runner.temp }}/destination-load-tests.json
            ${{ runner.temp }}/destination-load-metrics.json
          if-no-files-found: error
          retention-days: 7
  queue-pressure:
    name: Four saturated queue lanes and actual decoded heap (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
      - name: Verify exact preferred PSP compiler
        run: |
          set -euo pipefail
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - name: Check pressure evidence rejection and production queue tests
        run: |
          set -euo pipefail
          node --test deploy/destination_queue_pressure_test.mjs
          go test -count=1 ./internal/service/destaudit
          go test -c -tags destination_pressure -o "$RUNNER_TEMP/destination-queue-pressure.test" ./internal/service/destaudit
      - name: Saturate each real queue reservation with separately decoded request bodies
        run: |
          set -euo pipefail
          PSP_NATIVE_QUEUE_METRICS="$RUNNER_TEMP/destination-queue-pressure-metrics.json" \
            "$RUNNER_TEMP/destination-queue-pressure.test" \
              -test.v=test2json -test.run '^TestNativeDestinationQueuePressure$' -test.benchtime=1x -test.timeout=5m 2>&1 \
            | go tool test2json -t -p github.com/KazuhaHub/passwall-sub-panel/internal/service/destaudit \
            | node deploy/destination-queue-pressure.mjs sanitize > "$RUNNER_TEMP/destination-queue-pressure-tests.json"
          node deploy/destination-queue-pressure.mjs "$RUNNER_TEMP/destination-queue-pressure-tests.json" "$RUNNER_TEMP/destination-queue-pressure-metrics.json"
      - name: Keep bounded queue and heap evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-destination-queue-pressure-${{ github.sha }}
          path: |
            ${{ runner.temp }}/destination-queue-pressure-tests.json
            ${{ runner.temp }}/destination-queue-pressure-metrics.json
          if-no-files-found: error
          retention-days: 7
  sql-pressure:
    name: Four full lanes and hourly budgets through real ${{ matrix.database }} chunks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            evidence_prefix: native-destination-sql-pressure
          - database: mysql
            evidence_prefix: native-destination-sql-pressure-mysql
          - database: postgres
            evidence_prefix: native-destination-sql-pressure-postgres
    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8' || '' }}
        env:
          MYSQL_DATABASE: psp_native_pressure
          MYSQL_USER: psp
          MYSQL_PASSWORD: fixture-native-pressure-password
          MYSQL_ROOT_PASSWORD: fixture-native-pressure-root-password
        ports:
          - '33307:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u psp -pfixture-native-pressure-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: psp_native_pressure
          POSTGRES_USER: psp
          POSTGRES_PASSWORD: fixture-native-pressure-password
        ports:
          - '35432:5432'
        options: >-
          --health-cmd="pg_isready -U psp -d psp_native_pressure"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
      - name: Verify exact preferred PSP compiler
        run: |
          set -euo pipefail
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - name: Check closed SQL evidence and compile the real worker pressure driver
        run: |
          set -euo pipefail
          node --test deploy/destination_sql_pressure_test.mjs
          go test -c -tags destination_pressure -o "$RUNNER_TEMP/destination-sql-pressure.test" ./internal/adapters/sqlstore
      - name: Drain four saturated production lanes through the exact owned SQL service
        env:
          PSP_NATIVE_SQL_PRESSURE_DB_KIND: ${{ matrix.database }}
        run: |
          set -euo pipefail
          PSP_NATIVE_SQL_PRESSURE_METRICS="$RUNNER_TEMP/destination-sql-pressure-metrics.json" \
            "$RUNNER_TEMP/destination-sql-pressure.test" \
              -test.v=test2json -test.run '^TestNativeDestinationSQLPressure$' -test.timeout=10m 2>&1 \
            | go tool test2json -t -p github.com/KazuhaHub/passwall-sub-panel/internal/adapters/sqlstore \
            | node deploy/destination-sql-pressure.mjs sanitize > "$RUNNER_TEMP/destination-sql-pressure-tests.json"
          node deploy/destination-sql-pressure.mjs "$RUNNER_TEMP/destination-sql-pressure-tests.json" "$RUNNER_TEMP/destination-sql-pressure-metrics.json" "${{ matrix.database }}"
      - name: Keep fixed execution identities and bounded SQL pressure counts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.evidence_prefix }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/destination-sql-pressure-tests.json
            ${{ runner.temp }}/destination-sql-pressure-metrics.json
          if-no-files-found: error
          retention-days: 7
  trial-load:
    name: 200-user five-minute trial and independent block load (SQLite / Xray 26.6.27)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
      - name: Verify exact preferred PSP compiler
        run: |
          set -euo pipefail
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - uses: actions/checkout@v7
        with:
          repository: KazuhaHub/Passwall-Node
          ref: cef54ddba3ee96f9794aaacdc6ac1ed89cc318f9
          path: node-source
      - name: Build immutable full-module Node with its own preferred compiler
        working-directory: node-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cef54ddba3ee96f9794aaacdc6ac1ed89cc318f9
          toolchain=$(awk '$1 == "toolchain" { print $2; exit }' go.mod)
          test -n "$toolchain"
          test "$(GOTOOLCHAIN="$toolchain" go tool compile -V | awk '{ print $3 }')" = "$toolchain"
          GOTOOLCHAIN="$toolchain" CGO_ENABLED=0 go build -o "$RUNNER_TEMP/destination-node" ./cmd/node
      - name: Test evidence rejection and owned process counter boundaries
        run: |
          set -euo pipefail
          node --test deploy/destination_trial_load_test.mjs deploy/destination_trial_latency_test.mjs
          go test -v -count=1 ./internal/app -run '^(TestNativeLoadProcCountersRequireBirthAndExactCPUFields|TestNativeTrialProvisioningRequiresObservedRuntimeAndInbound)$'
          go test -c -tags destination_acceptance -o "$RUNNER_TEMP/destination-trial-load.test" ./internal/app
      - name: Actual production App.Run, 200 users with trial saturation and independent blocking
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_REPOSITORY,RUNNER_ENVIRONMENT,RUNNER_TEMP \
            env PSP_NATIVE_NODE_BIN="$RUNNER_TEMP/destination-node" \
            PSP_NATIVE_CORE_VERSION=26.6.27 PSP_NATIVE_DB_KIND=sqlite \
            PSP_NATIVE_LOAD_METRICS="$RUNNER_TEMP/destination-trial-load-metrics.json" \
            "$RUNNER_TEMP/destination-trial-load.test" \
              -test.v=test2json -test.run '^TestNativeDestinationTrialLoad$' -test.timeout=20m 2>&1 \
            | go tool test2json -t -p github.com/KazuhaHub/passwall-sub-panel/internal/app \
            | node deploy/destination-acceptance.mjs sanitize > "$RUNNER_TEMP/destination-trial-load-tests.json"
          node deploy/destination-trial-load.mjs "$RUNNER_TEMP/destination-trial-load-tests.json" "$RUNNER_TEMP/destination-trial-load-metrics.json"
          node deploy/destination-trial-latency.mjs "$RUNNER_TEMP/destination-trial-load-tests.json" "$RUNNER_TEMP/destination-trial-load-metrics.json" "$RUNNER_TEMP/destination-trial-load-latency.json"
      - name: Keep bounded count and resource evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-destination-trial-load-${{ github.sha }}
          path: |
            ${{ runner.temp }}/destination-trial-load-tests.json
            ${{ runner.temp }}/destination-trial-load-metrics.json
            ${{ runner.temp }}/destination-trial-load-latency.json
          if-no-files-found: error
          retention-days: 7
  block-overflow:
    name: five-minute independent block quota overflow (SQLite / Xray 26.6.27)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
      - name: Verify exact preferred PSP compiler
        run: |
          set -euo pipefail
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - uses: actions/checkout@v7
        with:
          repository: KazuhaHub/Passwall-Node
          ref: cef54ddba3ee96f9794aaacdc6ac1ed89cc318f9
          path: node-source
      - name: Build immutable full-module Node with its own preferred compiler
        working-directory: node-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = cef54ddba3ee96f9794aaacdc6ac1ed89cc318f9
          toolchain=$(awk '$1 == "toolchain" { print $2; exit }' go.mod)
          test -n "$toolchain"
          test "$(GOTOOLCHAIN="$toolchain" go tool compile -V | awk '{ print $3 }')" = "$toolchain"
          GOTOOLCHAIN="$toolchain" CGO_ENABLED=0 go build -o "$RUNNER_TEMP/destination-node" ./cmd/node
      - name: Test evidence rejection and owned process counter boundaries
        run: |
          set -euo pipefail
          node --test deploy/destination_block_overflow_test.mjs
          go test -v -count=1 ./internal/app -run '^(TestNativeLoadProcCountersRequireBirthAndExactCPUFields|TestNativeLoadMetricSchemaSeparatesOverflowBudget)$'
          go test -c -tags destination_acceptance -o "$RUNNER_TEMP/destination-block-overflow.test" ./internal/app
      - name: Actual production App.Run, sustained unique block destinations beyond quota
        run: |
          set -euo pipefail
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_REPOSITORY,RUNNER_ENVIRONMENT,RUNNER_TEMP \
            env PSP_NATIVE_NODE_BIN="$RUNNER_TEMP/destination-node" \
            PSP_NATIVE_CORE_VERSION=26.6.27 PSP_NATIVE_DB_KIND=sqlite \
            PSP_NATIVE_LOAD_METRICS="$RUNNER_TEMP/destination-block-overflow-metrics.json" \
            "$RUNNER_TEMP/destination-block-overflow.test" \
              -test.v=test2json -test.run '^TestNativeDestinationBlockOverflow$' -test.timeout=20m 2>&1 \
            | go tool test2json -t -p github.com/KazuhaHub/passwall-sub-panel/internal/app \
            | node deploy/destination-acceptance.mjs sanitize > "$RUNNER_TEMP/destination-block-overflow-tests.json"
          node deploy/destination-block-overflow.mjs "$RUNNER_TEMP/destination-block-overflow-tests.json" "$RUNNER_TEMP/destination-block-overflow-metrics.json"
      - name: Keep bounded count and resource evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-destination-block-overflow-${{ github.sha }}
          path: |
            ${{ runner.temp }}/destination-block-overflow-tests.json
            ${{ runner.temp }}/destination-block-overflow-metrics.json
          if-no-files-found: error
          retention-days: 7
