name: Upstream compat watch

# Watches 3X-UI and S-UI for releases past the tested ceilings in
# the active v4 prerelease-aware range overlay, and watches our OWN published
# Node releases for ones the upgrade registry has not ruled on.
#
# WHY THIS IS A JOB AND NOT A CHECKLIST ITEM: the ceiling is the only compat
# fact that goes stale with nobody editing anything — it is a claim about an
# upstream that keeps shipping. And its failure is quiet from the maintainer's
# side but loud from the admin's: PSP refuses a panel upgrade whose target
# exceeds the ceiling, so a stale file shows up as somebody being blocked from
# upgrading, months after the release that did it.
#
# The Node registry check exists because its failure is quiet from EVERY side.
# Every other check reads that registry instead of questioning it, so a release
# that shipped and that nobody reviewed is invisible to all of them: the upgrade
# dialog just keeps recommending whatever it already had. It is the mirror of the
# ceiling above — there an upstream outran us, here our own releases did.
#
# It never edits either file. Raising a ceiling means the live-panel review pass
# in docs/3xui-compat.md; reviewing a Node release means a human deciding whether
# to offer it. A job that edited them automatically would be asserting precisely
# the thing it did not verify. What it refuses to allow is SILENCE.
#
# A red run here is not a broken build — it is the signal. Two different reds:
# exit 1 means a real gap (do the review pass, or record the decision), exit 2
# means a comparison could not be made at all (the watcher itself needs
# attention). "Could not tell" is deliberately not green, because an upstream
# whose releases we can no longer read looks exactly like one that has shipped
# nothing.

on:
  schedule:
    # Mondays 03:17 UTC. Off the hour on purpose — scheduled runs at :00 queue
    # behind everyone else's and get delayed or dropped.
    - cron: "17 3 * * 1"
  workflow_dispatch:
  # Also on changes to the inputs, so an edit that puts the compat file out of
  # reach of its own watcher is caught on the PR rather than on the next Monday.
  # reviewed.json is listed for the same reason from the other direction: adding
  # a release is the very edit this check has an opinion about.
  pull_request:
    paths:
      - "docs/compat/**"
      - "cmd/compatwatch/**"
      - "internal/version/ceiling*.go"
      - "internal/adapters/noderelease/reviewed.json"
      - ".github/workflows/compat-watch.yml"

permissions:
  contents: read

jobs:
  watch:
    name: ceilings and node registry vs published releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Built rather than `go run`: go run reports a child's non-zero exit as
      # plain 1, which would collapse "an upstream is ahead" (1) into "the
      # watcher could not tell" (2) — the one distinction this job exists to
      # make. Verified: a program calling os.Exit(2) comes back as 1 under
      # `go run` and as 2 when the built binary is executed.
      - name: build the watcher
        run: go build -o /tmp/compatwatch ./cmd/compatwatch
      - name: compare ceilings and the node registry against published releases
        env:
          # Lifts the GitHub API quota off the anonymous 60/hour-per-IP limit
          # that Actions runners share, so an "unknown" verdict means something
          # about the upstream rather than about the runner's neighbours.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          /tmp/compatwatch
          code=$?
          set -e
          case "$code" in
            0) echo "::notice::Upstream ceilings are current and every published Node release is accounted for." ;;
            1) echo "::error::A compat gap is real. Either an upstream has released past its tested ceiling (do the live-panel review in docs/3xui-compat.md before moving the number in docs/compat/v4-ranges.json), or a published Node release is neither reviewed in internal/adapters/noderelease/reviewed.json nor excluded there with a reason. The table above names which." ;;
            2) echo "::error::A comparison could not be made — the watcher itself needs attention (upstream repo moved, API shape changed, or rate limited). This is NOT a clean bill of health." ;;
            *) echo "::error::compatwatch exited $code" ;;
          esac
          exit $code
