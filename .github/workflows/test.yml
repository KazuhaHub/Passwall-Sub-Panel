name: Test

# Runs the Go test suite, the SPA type/build check, and a cross-platform compile
# check. The build job cross-compiles the deployable binary for every release
# GOOS/GOARCH (CGO off, pure Go) so a platform-specific build break is caught
# here on push/PR instead of only when a release tag is cut. Go static checks
# run once. The canonical SQLite job runs the whole Go suite under the race
# detector. PostgreSQL and MySQL run the DB-adapter package separately; those
# server dialects reuse an initialized schema for ordinary repository tests
# while migration/DDL tests retain fresh databases. Every Go test invocation
# bypasses the Go result cache and uploads output on failure.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"

permissions:
  contents: read

# Superseded commits do not need to keep consuming the public-runner pool. A
# main push still runs the full suite: branch protection currently permits a
# tested PR to merge without first updating to the latest base.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-compatibility:
    name: node compatibility (released range)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - name: Exercise every supported wire contract
        run: |
          set -euo pipefail
          # THE SUPPORTED SET IS DERIVED, NOT LISTED. `min_supported` in the
          # manifest names the oldest node this panel still supports, and
          # everything from that row onward is what gets exercised — so the
          # matrix stops growing once the floor moves, instead of gaining a
          # permanent row per release. The list used to be hardcoded here, in
          # release.yml and in the manifest, which meant three places to forget.
          #
          # Matched by POSITION, never by comparing versions: the prerelease
          # suffix sorts lexically, so v0.0.1-beta9 ranks above v0.0.1-beta11.
          versions=$(python3 -c 'import json;d=json.load(open("docs/compat/node-v4.json"));r=[x["version"] for x in d["released_nodes"]];print(" ".join(r[r.index(d["min_supported"]):]))')
          test -n "$versions"
          echo "supported nodes: $versions"
          node_repo="$RUNNER_TEMP/passwall-node"
          git init "$node_repo"
          git -C "$node_repo" remote add origin https://github.com/KazuhaHub/Passwall-Node.git
          failed=0
          for node_version in $versions
          do
            git -C "$node_repo" fetch --force --depth=1 origin "refs/tags/$node_version"
            git -C "$node_repo" checkout --force --detach FETCH_HEAD

            # ONE EVIDENCE DIRECTORY PER VERSION. A shared one would let the
            # last version's log overwrite an earlier one's, so the report that
            # survived would be about whichever happened to run last.
            evidence="evidence/$node_version"
            mkdir -p "$evidence"

            # The exit code is CAPTURED rather than allowed to end the step. The
            # validator has to run even when the tests failed, because its report
            # is what says WHICH required item did not pass; stopping here would
            # leave a red build and no reason. stderr is kept in its own file so
            # a panic or a build error cannot leak into the JSON stream the
            # validator parses.
            test_exit=0
            PSP_LIVE_NODE_REPO="$node_repo" go test -json -count=1 -timeout=5m \
              ./internal/service/nodesync \
              -run '^TestLive_RealNode(AgentContract|MigratedServerContract|TaskEvidenceReceipt|TaskExpiryContract)$' \
              > "$evidence/go-events.jsonl" 2> "$evidence/go-stderr.txt" || test_exit=$?

            # A green `go test` is not evidence that the contract was exercised.
            # `-run` matching nothing, a skip taken because PSP_LIVE_NODE_REPO
            # was never set, and a truncated log all exit 0 with no coverage —
            # so the run is judged against the profile, never against its own
            # exit code.
            if node deploy/compat/check-go-results.mjs \
              --profile node-wire-v1 \
              --input "$evidence/go-events.jsonl" \
              --go-exit-code "$test_exit" \
              --output "$evidence/result.json"
            then
              echo "✓ $node_version"
            else
              echo "✗ $node_version"
              failed=1
            fi
          done
          exit "$failed"
      - name: upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: node-compatibility-test-output
          path: evidence/

  node-contract:
    name: node contract (pinned published source)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      # Exercise exactly the published Node revision consumed by PSP, not a
      # floating main branch or a developer's go.work replacement. The live
      # task test needs a writable test-only fixture inside that module; copy
      # the checksum-verified source instead of modifying the module cache.
      - name: real Node sync, durable result receipt and task expiry
        run: |
          set -euo pipefail
          go mod download github.com/KazuhaHub/passwall-node
          node_module_dir=$(go list -m -f '{{.Dir}}' github.com/KazuhaHub/passwall-node)
          test -n "$node_module_dir"
          test -f "$node_module_dir/go.mod"
          contract_repo=$(mktemp -d "$RUNNER_TEMP/psp-node-contract.XXXXXX")
          cp -R "$node_module_dir/." "$contract_repo/"
          chmod -R u+w "$contract_repo"
          test -f "$contract_repo/go.mod"
          mkdir -p evidence
          # Captured, not propagated: the validator has to run even when the
          # tests failed, because its report is what names the required item that
          # did not pass. stderr stays separate from the JSON stream.
          test_exit=0
          PSP_LIVE_NODE_REPO="$contract_repo" go test -json -count=1 -timeout=5m \
            ./internal/service/nodesync \
            -run '^TestLive_RealNode(AgentContract|MigratedServerContract|TaskEvidenceReceipt|TaskExpiryContract)$' \
            > evidence/go-events.jsonl 2> evidence/go-stderr.txt || test_exit=$?
          node deploy/compat/check-go-results.mjs \
            --profile node-wire-v1 \
            --input evidence/go-events.jsonl \
            --go-exit-code "$test_exit" \
            --output evidence/result.json
      - name: upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: node-contract-test-output
          path: evidence/

  container:
    name: Docker source and release runtime baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - name: Build both Docker paths and execute isolated binary version checks
        run: |
          set -euo pipefail
          docker build --build-arg VERSION=ci --tag psp-source-check .
          runtime_context=$(mktemp -d "$RUNNER_TEMP/psp-runtime-check.XXXXXX")
          mkdir -p "$runtime_context/bin/linux-amd64"
          container_id=$(docker create psp-source-check --version)
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/app/psp" "$runtime_context/bin/linux-amd64/psp"
          cp docker-entrypoint.sh "$runtime_context/"
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          go version -m "$runtime_context/bin/linux-amd64/psp" | awk -v expected="$build_toolchain" 'NR == 1 { ok = ($NF == expected) } END { exit !ok }'
          docker build -f Dockerfile.release --build-arg TARGETARCH=amd64 --tag psp-release-runtime-check "$runtime_context"
          runtime_base=$(awk '$1 == "FROM" && $2 ~ /^alpine:/ { sub(/^alpine:/, "", $2); print $2 }' Dockerfile)
          for image in psp-source-check psp-release-runtime-check; do
            test "$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /bin/cat "$image" /etc/alpine-release)" = "$runtime_base"
            # Version exits before configuration, DB bootstrap or HTTP binding.
            # This verifies binary execution, not the panel's production startup.
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 --entrypoint /app/psp "$image" --version
          done
      - name: Publisher identity, compat result validator and fail-closed guard tests
        run: node --test deploy/check_image_test.mjs deploy/check_build_test.mjs deploy/release_workflow_test.mjs deploy/compat/check-go-results.test.mjs

  web:
    name: web (typecheck + build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - name: Install dependencies
        working-directory: web-react
        run: npm ci
      - name: build
        working-directory: web-react
        run: npm run build
      - name: production browser smoke
        working-directory: web-react
        run: npm run smoke:dist
      - name: Real Chromium server reinstallation flows (isolated fixtures)
        run: |
          set -euo pipefail
          browser_acceptance_dir=$(mktemp -d "$RUNNER_TEMP/psp-reinstall-browser.XXXXXX")
          npm install --prefix "$browser_acceptance_dir" --no-package-lock --ignore-scripts playwright@1.63.0
          node "$browser_acceptance_dir/node_modules/playwright/cli.js" install --with-deps chromium
          node web-react/scripts/reinstall-browser.mjs "$browser_acceptance_dir/node_modules/playwright"
      - name: unit tests
        working-directory: web-react
        run: npm run test

  build_targets:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      # Cross-compile the deployable binary for one release GOOS/GOARCH. The
      # matrix runs each target independently and in parallel. The binary is
      # pure Go (CGO_ENABLED=0), so this needs no C toolchain. The committed
      # internal/web/dist/.gitkeep satisfies //go:embed all:dist, so no SPA
      # build is required just to confirm the Go binary links — the web job
      # covers the SPA build separately. Output is discarded (-o /dev/null);
      # we only care that this target compiles.
      - name: cross-compile ./cmd/panel
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/panel

  # Keep one stable required check for branch protection while the target
  # builds above remain independent matrix jobs.
  build:
    name: build (cross-compile release targets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build_targets
    if: ${{ always() }}
    steps:
      - name: Verify all cross-compile targets passed
        env:
          TARGET_RESULT: ${{ needs.build_targets.result }}
        run: test "$TARGET_RESULT" = success

  go_static:
    name: go (static checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - run: go vet ./...
      - name: Reachable vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The race suite is sharded because it is the critical path: at 4m22s it was
  # still running while the other twenty-two checks had finished.
  #
  # THE SHARDS COMPUTE THEIR OWN PACKAGES from a deterministic planner, so the
  # matrix carries only the shard number. Putting the package list in the matrix
  # would put it in the job name as well — GitHub appends every matrix value —
  # and the check would read "go race full (1/4, <eighty package paths>)".
  #
  # `sqlite (full suite, race)` keeps its name and becomes a gate over them.
  # Branch protection requires that exact context, and a matrix reports as
  # several checks, so a split that renamed the job would leave the required
  # context unproduced and block every merge on main.
  race-shard:
    name: go race full (${{ matrix.part }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # A failing shard must not cancel its siblings: the reason to shard is to
      # see every failure in one run, and fail-fast would hide the rest.
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - name: test
        run: |
          set -o pipefail
          packages=$(.github/scripts/plan-race-shards.sh \
            --shards 4 --shard "${{ matrix.part }}" \
            --default 1 --weights .github/race-shard-weights.txt)
          # A planner that produced no packages would otherwise run `go test`
          # with no arguments — which tests the repository root and reports
          # "no Go files in ...", naming the symptom rather than the cause.
          test -n "$packages"
          # Still one canonical full-suite race run: the shards are a partition
          # of the same package set, so every package is covered exactly once.
          # PostgreSQL/MySQL below focus on dialect correctness without
          # multiplying race-detector runtime.
          go test -race -count=1 -timeout=8m $packages 2>&1 | tee test-output.txt
      - name: upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: race-shard-${{ matrix.part }}-test-output
          path: test-output.txt

  sqlite:
    name: sqlite (full suite, race)
    needs: race-shard
    # always() so a failed, cancelled or never-planned shard still produces a
    # verdict here. A skipped gate would report as a missing required check,
    # which reads as "not run" rather than "failed".
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every shard passed
        run: test "${{ needs.race-shard.result }}" = success

  postgres:
    name: postgres (sqlstore dialect)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: psp
          POSTGRES_PASSWORD: psp
          POSTGRES_DB: psptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psp -d psptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PSP_TEST_DB_KIND: postgres
      PSP_TEST_DB_DSN: postgres://psp:psp@localhost:5432/psptest?sslmode=disable
      PSP_TEST_DB_REUSE_SCHEMA: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - name: test
        run: |
          set -o pipefail
          go test -count=1 -timeout=8m ./internal/adapters/sqlstore/... 2>&1 | tee test-output.txt
      - name: upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-test-output
          path: test-output.txt

  mysql:
    name: mysql (sqlstore dialect)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: psp
          MYSQL_DATABASE: psptest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ppsp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PSP_TEST_DB_KIND: mysql
      # {schema} is substituted by the test database fixture.
      PSP_TEST_DB_DSN: root:psp@tcp(127.0.0.1:3306)/{schema}?parseTime=true&multiStatements=true
      PSP_TEST_DB_REUSE_SCHEMA: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - name: test
        run: |
          set -o pipefail
          go test -count=1 -timeout=8m ./internal/adapters/sqlstore/... 2>&1 | tee test-output.txt
      - name: upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mysql-test-output
          path: test-output.txt
