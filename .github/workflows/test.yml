name: Test

# Runs the Go test suite, the SPA type/build check, and a cross-platform compile
# check. The build job cross-compiles the deployable binary for every release
# GOOS/GOARCH (CGO off, pure Go) so a platform-specific build break is caught
# here on push/PR instead of only when a release tag is cut. Go static checks
# run once. The canonical SQLite job runs the whole Go suite under the race
# detector. PostgreSQL and MySQL run the DB-adapter package separately, plus the
# traffic rollup, the one other package that writes dialect-specific SQL; those
# server dialects reuse an initialized schema for ordinary repository tests
# while migration/DDL tests retain fresh databases. Every Go test invocation
# bypasses the Go result cache and uploads output on failure.
#
# A PR AND A MAIN PUSH ARE NOT THE SAME RUN, in the one place where the
# difference buys something: a job whose verdict cannot change because of THIS
# PR does not need a runner slot on every push to the branch. The gates are the
# same on both paths — the merge gate and the post-merge backstop are the same
# checks — and `third-party-isolated` is the one job that qualifies, for the
# reason its comment gives.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GOWORK: "off"
  GOTOOLCHAIN: "local"

permissions:
  contents: read

# Superseded commits do not need to keep consuming the public-runner pool — and
# a PR push supersedes the one before it, so cancelling is right there.
#
# A MAIN PUSH IS NOT SUPERSEDED BY THE NEXT MERGE. The group used to be keyed on
# the ref for both events, which meant every main push shared one group with the
# merge after it and `cancel-in-progress` killed the run in flight. Three of the
# last forty main runs were cancelled that way, and because branch protection
# permits a tested PR to merge without updating to the latest base, that run is
# the only thing standing between "two PRs each passed" and a broken main: the
# protection did not fail, it disappeared. So a main push and a manual run get
# their own group each — `github.run_id` — and cancel nothing.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node-compatibility:
    name: node compatibility (released range)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The build cache pair the build job explains: restored on every event, and
      # saved only from the default branch, where a save can be read.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-node-compat-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-node-compat-${{ runner.os }}-
      - uses: actions/setup-go@v7
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - name: Exercise every supported wire contract
        run: |
          set -euo pipefail
          # THE PLAN, NOT A LIST. `min_supported` in the manifest names the oldest
          # node this panel still tests, and the matrix exercises THAT ROW AND THE
          # NEWEST one: a harness that breaks against an old release and against a
          # new one is caught by the pair, while the rows between them are the
          # manifest's record of what was reviewed rather than a list of what is
          # run. The list used to be hand-written here, in release.yml and in the
          # manifest, which meant three places to forget. The planner reads the one
          # data source, and each case carries the commit its tag must still
          # resolve to.
          #
          # Matched by POSITION, never by comparing versions: the prerelease
          # suffix sorted lexically, so v0.0.1-beta9 ranked above v0.0.1-beta11.
          # The scheme is gone and the rule is kept, because it is the mechanism
          # both sides implement: a version compares numerically now, so the two
          # agree, and the floor stays an index rather than a comparison.
          #
          # Written to a file and read back line by line rather than expanded
          # into the shell: the planner validates every element, and nothing it
          # emits should ever become a shell argument by string interpolation.
          # THE TAG IS THE REF AND THE VERSION IS THE IDENTITY. They are never the
          # same string: a release lives at refs/tags/release/4.0.0 and is named
          # 4.0.0, so fetching the ref by version asks for a tag that does not
          # exist, and the case id is built from the version.
          node deploy/compat/plan.mjs --emit cases \
            | python3 -c 'import json,sys;[print(c["tag"], c["version"], c["sha"]) for c in json.load(sys.stdin)]' \
            > "$RUNNER_TEMP/node-cases.txt"
          test -s "$RUNNER_TEMP/node-cases.txt"
          echo "planned cases:"; cat "$RUNNER_TEMP/node-cases.txt"
          node_repo="$RUNNER_TEMP/passwall-node"
          git init "$node_repo"
          git -C "$node_repo" remote add origin https://github.com/KazuhaHub/Passwall-Node.git
          failed=0
          while read -r node_tag node_version node_sha
          do
            git -C "$node_repo" fetch --force --depth=1 origin "refs/tags/$node_tag"
            git -C "$node_repo" checkout --force --detach FETCH_HEAD

            # A TAG IS A LABEL, NOT AN IDENTITY. If it moved, this leg would
            # otherwise test a different commit from the one the policy was
            # verified against while still reporting the same version.
            resolved=$(git -C "$node_repo" rev-parse HEAD)
            if [ "$resolved" != "$node_sha" ]; then
              echo "::error::$node_tag now resolves to $resolved, but the plan pinned $node_sha. A tag moved; re-verify before re-pinning."
              failed=1
              continue
            fi

            # ONE EVIDENCE DIRECTORY PER CASE, NAMED FOR THE CASE. The summary
            # gate derives the expected set and looks each case up by name, so
            # evidence filed under any other name reads as a case that never
            # reported — which is exactly what a cancelled run looks like. A
            # shared directory would also let the last version's log overwrite an
            # earlier one's, so the surviving report would describe whichever
            # happened to run last.
            case_id="node-wire-v1@$node_version"
            evidence="evidence/$case_id"
            mkdir -p "$evidence"

            # The exit code is CAPTURED rather than allowed to end the step. The
            # validator has to run even when the tests failed, because its report
            # is what says WHICH required item did not pass; stopping here would
            # leave a red build and no reason. stderr is kept in its own file so
            # a panic or a build error cannot leak into the JSON stream the
            # validator parses.
            test_exit=0
            PSP_LIVE_NODE_REPO="$node_repo" go test -json -count=1 -timeout=5m \
              ./internal/service/nodesync \
              -run '^TestLive_RealNode(AgentContract|MigratedServerContract|TaskEvidenceReceipt|TaskExpiryContract)$' \
              > "$evidence/go-events.jsonl" 2> "$evidence/go-stderr.txt" || test_exit=$?

            # WHICH two implementations produced this result, and where. A report
            # that cannot name its inputs cannot be re-checked. Written with
            # printf rather than a heredoc: this block sits one level inside a
            # loop, and a heredoc terminator keeps whatever indentation the block
            # scalar left it, so it would never close.
            {
              printf '{\n'
              printf '  "case": "%s",\n' "$case_id"
              printf '  "profile": "node-wire-v1",\n'
              printf '  "psp_sha": "%s",\n' "${{ github.sha }}"
              printf '  "node_version": "%s",\n' "$node_version"
              printf '  "node_sha": "%s",\n' "$(git -C "$node_repo" rev-parse HEAD)"
              printf '  "runner_os": "%s",\n' "$RUNNER_OS"
              printf '  "runner_arch": "%s",\n' "$RUNNER_ARCH"
              printf '  "run_id": "%s",\n' "${{ github.run_id }}"
              printf '  "run_attempt": "%s"\n' "${{ github.run_attempt }}"
              printf '}\n'
            } > "$evidence/environment.json"

            # A green `go test` is not evidence that the contract was exercised.
            # `-run` matching nothing, a skip taken because PSP_LIVE_NODE_REPO
            # was never set, and a truncated log all exit 0 with no coverage —
            # so the run is judged against the profile, never against its own
            # exit code.
            if node deploy/compat/check-go-results.mjs \
              --profile node-wire-v1 \
              --input "$evidence/go-events.jsonl" \
              --go-exit-code "$test_exit" \
              --output "$evidence/result.json"
            then
              echo "✓ $node_version"
            else
              echo "✗ $node_version"
              failed=1
            fi
          done < "$RUNNER_TEMP/node-cases.txt"
          exit "$failed"
      - name: upload case evidence
        # Uploaded whatever the verdicts were. A report is only useful when it
        # can be read after a failure, and a failure is the only time anybody
        # looks.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-compatibility-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-node-compat-${{ runner.os }}-${{ hashFiles('go.sum') }}

  node-contract:
    name: node contract (pinned published source)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      # The build cache pair the build job explains: restored on every event, and
      # saved only from the default branch, where a save can be read.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-node-contract-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-node-contract-${{ runner.os }}-
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      # Exercise exactly the Node revision the manifest names, not a floating
      # main branch, not a developer's go.work replacement, and NOT whatever
      # PSP's go.mod happens to pin.
      #
      # THE SOURCE IS A FACT ABOUT WHAT TO TEST, NOT ABOUT WHAT PSP DEPENDS ON.
      # Resolving it from go.mod made the evidence move with every dependency
      # bump, and would have removed this job's entry point the moment the PN
      # root module was dropped (X07) — the test would have disappeared along
      # with the dependency rather than outliving it.
      #
      # A commit, checked out and verified: a tag can be moved, and the
      # assertion below is what turns a moved tag into a failure instead of a
      # different revision quietly under test.
      - name: real Node sync, durable result receipt and task expiry
        run: |
          set -euo pipefail
          source_commit=$(node deploy/compat/contract-source.mjs --commit)
          source_tag=$(node deploy/compat/contract-source.mjs --tag)
          # THE URL IS COMPOSED WHERE IT IS TESTED. It used to be built here as
          # "https://github.com/${module_path}.git", and module_path is a GO MODULE
          # PATH that already begins with the host — so the fetch asked for
          # github.com/github.com/... and the job failed at its first step, blaming
          # whatever diff was in front of it. The composition lives in
          # contract-source.mjs now, one line with a test.
          source_url=$(node deploy/compat/contract-source.mjs --repo-url)
          contract_repo=$(mktemp -d "$RUNNER_TEMP/psp-node-contract.XXXXXX")
          git -C "$contract_repo" init -q
          git -C "$contract_repo" remote add origin "$source_url"
          git -C "$contract_repo" fetch -q --depth 1 origin "$source_commit"
          git -C "$contract_repo" checkout -q FETCH_HEAD
          test "$(git -C "$contract_repo" rev-parse HEAD)" = "$source_commit"
          test -f "$contract_repo/go.mod"
          # NOT a per-version case: this job exercises the exact published
          # revision PSP consumes, whatever go.mod pins, rather than a released
          # tag. It is filed under its own name so it cannot collide with the
          # matrix case for the same version, and so it is visible as additional
          # evidence rather than mistaken for one of the promised cases.
          evidence="evidence/pinned-source"
          mkdir -p "$evidence"
          # Captured, not propagated: the validator has to run even when the
          # tests failed, because its report is what names the required item that
          # did not pass. stderr stays separate from the JSON stream.
          test_exit=0
          PSP_LIVE_NODE_REPO="$contract_repo" go test -json -count=1 -timeout=5m \
            ./internal/service/nodesync \
            -run '^TestLive_RealNode(AgentContract|MigratedServerContract|TaskEvidenceReceipt|TaskExpiryContract)$' \
            > "$evidence/go-events.jsonl" 2> "$evidence/go-stderr.txt" || test_exit=$?
          node deploy/compat/check-go-results.mjs \
            --profile node-wire-v1 \
            --input "$evidence/go-events.jsonl" \
            --go-exit-code "$test_exit" \
            --output "$evidence/result.json"
          # TWO CROSS-REPOSITORY CONTRACTS ARE CHECKED HERE, in the only job that
          # has the other repository on disk.
          #
          #   internal/version        PSP's copy of the shared version vectors is
          #                           still the copy the Node project publishes. Both
          #                           consumers — this repository's Go tests and the
          #                           front end's TypeScript tests — run against that
          #                           one file.
          #   internal/pkg/nodebootstrap
          #                           the migration wrapper's prerequisite list still
          #                           covers what the published installer requires. A
          #                           tool added there and not here defers the failure
          #                           until after the old service has been stopped.
          #   internal/adapters/corecatalogdoc
          #                           the reviewed catalog this build ships as data is
          #                           still the one the project publishes. A drifted
          #                           copy is a panel offering a pulled release.
          #
          # THEY RUN AFTER THE EVIDENCE IS WRITTEN so a divergence cannot mask the
          # wire result, and they read the checkout this step already verified.
          PSP_LIVE_NODE_REPO="$contract_repo" go test -count=1 \
            ./internal/version/ ./internal/pkg/nodebootstrap/ ./internal/adapters/corecatalogdoc/
          cat > "$evidence/environment.json" <<JSON
          {
            "case": "pinned-source",
            "profile": "node-wire-v1",
            "psp_sha": "${{ github.sha }}",
            "node_pinned_tag": "$source_tag",
            "node_sha": "$(git -C "$contract_repo" rev-parse HEAD 2>/dev/null || echo unknown)",
            "runner_os": "$RUNNER_OS",
            "runner_arch": "$RUNNER_ARCH",
            "run_id": "${{ github.run_id }}",
            "run_attempt": "${{ github.run_attempt }}"
          }
          JSON
      - name: upload case evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-contract-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 90

  # THE SUMMARY GATE FOR THE NODE WIRE CONTRACT. The two jobs above report their
  # own verdicts, but neither can answer the question this asks: whether EVERY
  # case the panel promises to test actually reported. A leg cancelled by a
  # superseded push, or an artifact upload that failed, leaves every case that
  # did report perfectly green and the run looking complete.
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-node-contract-${{ runner.os }}-${{ hashFiles('go.sum') }}
  compatibility:
    name: compatibility gate
    runs-on: ubuntu-latest
    needs: [node-compatibility, node-contract]
    # always(), so a failed or cancelled leg still produces a verdict. A skipped
    # gate would report as an absent check, which reads as "not run" rather than
    # "failed" — and an absent check blocks nothing.
    if: always()
    steps:
      - uses: actions/checkout@v7
      - name: Download every case report
        uses: actions/download-artifact@v7
        with:
          # SCOPED TO ITS OWN EVIDENCE, BECAUSE AN UNSCOPED DOWNLOAD FAILS ON ANYTHING.
          # This step reads the run's artifacts with no name, no id and no pattern — so
          # it depends on every artifact in the run being one it can download and
          # extract. One was not: the container job's build-push-action used to publish
          # a `….dockerbuild` build record as an artifact, the download of it failed
          # after five retries, and the gate went red on main reporting "the
          # compatibility evidence could not be downloaded" while the evidence was
          # sitting right there. That action is gone, but any job may upload something
          # this step cannot read, and the scope is what keeps that off the gate.
          #
          # The pattern keeps the layout the checker expects (one directory per
          # artifact) and matches the two legs the gate summarises.
          pattern: 'node-*-evidence'
          path: evidence
      - name: the compatibility jobs themselves succeeded
        env:
          RANGE: ${{ needs.node-compatibility.result }}
          CONTRACT: ${{ needs.node-contract.result }}
        run: |
          # Checked before the case set, so a cancelled or failed leg reads as
          # "the job did not succeed" rather than as a pile of missing cases.
          # The case-set check would also catch it, and would name the wrong
          # cause.
          test "$RANGE" = success
          test "$CONTRACT" = success
      - name: every expected case reported a pass
        run: |
          set -euo pipefail
          node deploy/compat/check-case-set.mjs --reports evidence --output case-set.json
          cat case-set.json
      - name: upload the case-set verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-gate-summary
          path: case-set.json
          if-no-files-found: warn
          retention-days: 90

  # THE REAL THIRD-PARTY PANELS. Everything above this point checks the panel
  # against fixtures; this starts actual 3X-UI and S-UI containers and drives the
  # adapters against them. It is the G2 layer, and it is the only evidence of its
  # type in the repository.
  third-party-isolated:
    name: third-party adapters (isolated real panels)
    # NOT ON A PR, AND THIS IS THE ONE JOB WHERE THAT IS THE RIGHT ANSWER.
    #
    # It is the only job here that is NOT a required check: it drives real 3X-UI
    # and S-UI containers, and a red run never blocked a merge — it informed one.
    # What it costs is real: two third-party images pulled from the network, the
    # longest timeout in the file, and a slot on every push to every branch. What
    # a PR gains from it is the answer to "did I break the adapter", which the
    # merge will also give, on main, where a red run is a fact rather than a
    # guess and the images are the ones the pinned fixtures did not cover.
    #
    # THE COST OF THE TRADE, stated: a PR that breaks an adapter now merges green
    # and turns main red. That is deliberate. The alternative is what this job
    # was — a 30-minute lane that gated nothing and occupied a slot on the path
    # developers are waiting on.
    #
    # NOTHING NEEDS THIS JOB, which is what makes the condition safe: a skipped
    # job skips its whole downstream chain, transitively, and `always()` on a job
    # in between does not restore the jobs under it. A condition here would take
    # the run's verdict with it if anything did.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The build cache pair the build job explains: restored on every event, and
      # saved only from the default branch, where a save can be read.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-third-party-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-third-party-${{ runner.os }}-
      - uses: actions/setup-go@v7
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      # The compiler gate must sit IMMEDIATELY after setup-go: the baseline guard
      # reads job steps positionally, so anything between them, including the Node
      # setup this job also needs, is a failure rather than a style choice.
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: start the isolated panels
        env:
          PSP_LIVE_3XUI_IMAGE: ${{ vars.PSP_LIVE_3XUI_IMAGE || 'ghcr.io/mhsanaei/3x-ui:latest' }}
          PSP_LIVE_SUI_IMAGE: ${{ vars.PSP_LIVE_SUI_IMAGE || 'ghcr.io/alireza0/s-ui:latest' }}
        run: deploy/compat/backends/third-party.sh up
      - name: drive every adapter surface
        run: |
          set -uo pipefail
          mkdir -p evidence
          # Each suite gets its own log and its own validator run: they are
          # different packages with different profiles, and a single combined
          # verdict could not say which of them measured less than it claims.
          # FAIL LOUDLY IF THE ENVIRONMENT IS EMPTY. An `env` that quietly
          # produces nothing leaves the tests to SKIP, and a skip is not a pass —
          # the validator below reports it as one of those, naming the profile
          # rather than the launcher that never gave it anything to run with.
          service_env=$(deploy/compat/backends/third-party.sh env)
          test -n "$service_env"
          echo "$service_env" | sed 's/\(TOKEN=\).*/\1<redacted>/'
          eval "$service_env"
          # READ THROUGH A CHILD PROCESS. `printenv` is an external command, so
          # it sees the EXPORTED environment and nothing else -- which is the
          # whole question, because `go test` below is a child too. Reading
          # `$name` here instead would have passed while the launcher printed
          # bare assignments: eval set a shell variable, every test skipped for
          # want of an environment, and this loop reported the environment fine.
          for name in PSP_LIVE_XUI_URL PSP_LIVE_XUI_TOKEN PSP_LIVE_XUI_DB PSP_LIVE_SUI_URL PSP_LIVE_SUI_TOKEN; do
            value=$(printenv "$name" || true)
            test -n "$value" || { echo "::error::$name is not exported to child processes; the launcher did not publish it for go test"; exit 1; }
          done
          # The floor matrix WRITES the panel's SQLite, and the write needs the
          # DIRECTORY, not the file: SQLite creates its journal beside it. Checked
          # here so a permission problem names itself, rather than surfacing as
          # `seed usage: unable to open database file: out of memory (14)` inside
          # a test log, which reads like a corrupt database.
          xui_db_dir=$(dirname "$PSP_LIVE_XUI_DB")
          test -w "$xui_db_dir" || { echo "::error::$xui_db_dir is not writable by $(id -un); TestLive_XUITrafficFloorMatrix seeds usage straight into it"; exit 1; }
          run_suite() {
            profile="$1"; pkg="$2"; out="$3"
            code=0
            go test -json -count=1 -timeout=20m "$pkg" -run '^TestLive_' > "evidence/$out.jsonl" 2> "evidence/$out.stderr" || code=$?
            node deploy/compat/check-go-results.mjs --profile "$profile" \
              --profiles deploy/compat/profiles-third-party.json \
              --input "evidence/$out.jsonl" --go-exit-code "$code" \
              --output "evidence/$out.json"
          }
          failed=0
          run_suite third-party-3xui-live ./internal/adapters/xui 3xui || failed=1
          run_suite third-party-sui-live ./internal/adapters/sui sui || failed=1
          exit "$failed"
      - name: upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: third-party-adapter-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
      - name: stop the panels
        if: always()
        run: deploy/compat/backends/third-party.sh down
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-third-party-${{ runner.os }}-${{ hashFiles('go.sum') }}

  container:
    name: Docker source and release runtime baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          # NOTHING IS COMPILED ON THIS RUNNER: the build happens inside the image, and
          # Go is here for `go tool compile -V` and `go version -m`. The ~372 MB setup-go
          # would restore is several seconds of download that nothing reads.
          cache: false
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      # NO LAYER CACHE, AND THAT IS A MEASUREMENT RATHER THAN AN OMISSION. #223 and
      # #225 gave this image a type=gha cache through setup-buildx and build-push-action,
      # because two docker builds were 111 of this job's 137 seconds. The job got slower:
      # 169s on a PR and 202s on main afterwards. The time is the go build, 74s on every
      # run, and it sits after `COPY . .`, so every commit invalidates it and no layer
      # cache can hold it. The layer it did hold, the module download, took 19s to
      # import, which is about what downloading costs; the builder added 11-22s of setup
      # and teardown; and main spent ~52s exporting the cache at the end. The action also
      # published a `.dockerbuild` build record as a run artifact, which is what broke the
      # compatibility gate's unscoped download (#226).
      #
      # So the source image is built on the runner's default builder. Its driver is
      # `docker`, which puts the result straight into the daemon's image store — where
      # the `docker create` and `docker run` checks below read it. If this is cached
      # again, the thing worth caching is the Go compile (a cache mount on
      # /root/.cache/go-build, persisted across runners), measured against these numbers
      # first; and a type=gha cache has to be the action's, because one named on a CLI
      # buildx call is silently never written (#225).
      - name: Build the source image
        run: docker build --build-arg VERSION=ci --tag psp-source-check .
      - name: Build the release runtime image and check both Docker paths
        run: |
          set -euo pipefail
          # `--load` IS HARMLESS HERE AND KEPT ON PURPOSE. The default builder's docker
          # driver loads by itself; a container-driver builder, if one is ever set up in
          # this job again, leaves the result out of the daemon's image store unless it
          # is asked — and every check below reads that store, so it would fail on an
          # image that built perfectly.
          runtime_context=$(mktemp -d "$RUNNER_TEMP/psp-runtime-check.XXXXXX")
          mkdir -p "$runtime_context/bin/linux-amd64"
          container_id=$(docker create psp-source-check --version)
          trap 'docker rm "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/app/psp" "$runtime_context/bin/linux-amd64/psp"
          cp docker-entrypoint.sh "$runtime_context/"
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          go version -m "$runtime_context/bin/linux-amd64/psp" | awk -v expected="$build_toolchain" 'NR == 1 { ok = ($NF == expected) } END { exit !ok }'
          docker buildx build --load -f Dockerfile.release --build-arg TARGETARCH=amd64 --tag psp-release-runtime-check "$runtime_context"
          runtime_base=$(awk '$1 == "FROM" && $2 ~ /^alpine:/ { sub(/^alpine:/, "", $2); print $2 }' Dockerfile)
          for image in psp-source-check psp-release-runtime-check; do
            test "$(docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint /bin/cat "$image" /etc/alpine-release)" = "$runtime_base"
            # Version exits before configuration, DB bootstrap or HTTP binding.
            # This verifies binary execution, not the panel's production startup.
            docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 --entrypoint /app/psp "$image" --version
          done
      - name: The entrypoint repairs ownership in the image it ships in
        run: |
          set -euo pipefail
          # THE IMAGE'S OWN USERLAND IS THE SUBJECT, NOT THE RUNNER'S. This repair
          # used `find … ! -uid … -exec chown … +` and swallowed the error: the
          # runtime is Alpine, BusyBox's find has no -uid, and every container start
          # therefore repaired ownership of nothing — silently — while the panel ran
          # as PUID and could not write its own data directory. It was found in
          # production, as a warning about a file the panel could not store.
          #
          # A GUARD THAT ONLY CHECKED THE OUTCOME could pass on a runner whose find is
          # GNU's and say nothing about the image, so the dialect is asserted first.
          docker run --rm --entrypoint /bin/sh psp-source-check \
            -c 'if find /app -maxdepth 0 -uid 0 2>&1 | grep -q "unrecognized: -uid"; then exit 0; fi; echo "the image shell understands -uid now; this guard is describing a constraint that moved"; exit 1'
          # A VOLUME, because the repair is about a mount that already exists: each
          # docker run would otherwise start from a clean layer and prove nothing.
          docker volume create psp-entrypoint-check >/dev/null
          trap 'docker volume rm psp-entrypoint-check >/dev/null' EXIT
          docker run --rm --entrypoint /bin/sh -v psp-entrypoint-check:/app/data psp-source-check \
            -c 'chown root:root /app/data && test "$(stat -c %u /app/data)" = 0'
          # The entrypoint drops into the panel, which exits on --version.
          docker run --rm -v psp-entrypoint-check:/app/data psp-source-check --version
          docker run --rm --entrypoint /bin/sh -v psp-entrypoint-check:/app/data psp-source-check \
            -c 'test "$(stat -c %u /app/data)" = 10001'
      - name: Publisher identity, compat result validators and fail-closed guard tests
        run: node --test deploy/check_image_test.mjs deploy/check_build_test.mjs deploy/release_workflow_test.mjs deploy/compat/check-go-results.test.mjs deploy/compat/check-case-set.test.mjs deploy/compat/plan.test.mjs deploy/compat/profiles.test.mjs deploy/compat/backends/third-party_env.test.mjs deploy/compat/evidence-index.test.mjs deploy/compat/contract-source.test.mjs deploy/tracked_text_test.mjs deploy/test_workflow_test.mjs

  web:
    name: web (typecheck + build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - name: Install dependencies
        working-directory: web-react
        run: npm ci
      # THE BROWSER IS A DOWNLOAD, NOT A BUILD. `playwright install chromium`
      # fetches it into a shared, version-keyed directory, so the only thing that
      # changes between runs is nothing — and the 50s this step cost was mostly the
      # fetch plus the apt dependencies it also installs (which are not cached and
      # still run).
      #
      # KEYED ON THE PINNED VERSION, because that is the only thing that can
      # invalidate the browser: a key that outlives the version it names would serve
      # a browser the pinned CLI did not ask for.
      #
      # Restored always, saved only from the default branch — the same split the Go
      # jobs use, for the same reason: a PR's save lands in a scope nothing reads.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.63.0
          restore-keys: playwright-chromium-${{ runner.os }}-
      - name: build
        working-directory: web-react
        run: npm run build
      - name: production browser smoke
        working-directory: web-react
        run: npm run smoke:dist
      - name: Real Chromium server reinstallation flows (isolated fixtures)
        run: |
          set -euo pipefail
          browser_acceptance_dir=$(mktemp -d "$RUNNER_TEMP/psp-reinstall-browser.XXXXXX")
          npm install --prefix "$browser_acceptance_dir" --no-package-lock --ignore-scripts playwright@1.63.0
          node "$browser_acceptance_dir/node_modules/playwright/cli.js" install --with-deps chromium
          node web-react/scripts/reinstall-browser.mjs "$browser_acceptance_dir/node_modules/playwright"
      - name: unit tests
        working-directory: web-react
        run: npm run test
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.63.0

  # ONE JOB, SIX TARGETS, AND THE REQUIRED CHECK NAME UNCHANGED.
  #
  # This was a six-leg matrix with a one-line gate job under it: seven runner
  # slots to compile six binaries, each leg paying its own checkout and toolchain
  # for about fifteen seconds of work. Branch protection requires the context
  # `build (cross-compile release targets)` — the name of the gate — so the merge
  # keeps that name on the job that does the work rather than spending a slot to
  # relay a verdict.
  #
  # THE LOOP DOES NOT STOP AT THE FIRST FAILURE. The matrix ran with
  # `fail-fast: false` for the reason this keeps: a target that does not compile
  # must not hide the five behind it, because the point of the job is every
  # platform's verdict from one run.
  build:
    name: build (cross-compile release targets)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # `cache: true` IS NOT THIS JOB'S BUILD CACHE, although it does restore one.
      # setup-go caches the compiled objects as well as the modules — its log resolves
      # both GOMODCACHE and GOCACHE and restores ~372 MB into them — but under ONE key
      # per toolchain and go.sum, shared by every job here and saved, on any event, by
      # whichever job gets there first: the frozen subset the next paragraph describes.
      # It did not hold the six cross-compiled targets, so every run recompiled them from
      # source: 354 seconds of it, measured identically on two consecutive runs. The
      # same target on a warm GOCACHE compiles in about two seconds, so the whole step
      # is the cache's to win. Every job in this file that compiles Go restores its own
      # build cache, under a key of its own.
      #
      # A KEY PER JOB RATHER THAN PER REPOSITORY. `actions/cache` will not save a
      # key that already exists, so several jobs sharing one key means whichever
      # finishes first freezes its own subset of objects for everyone else, and
      # the cache never grows past that. The build job's objects are its own —
      # six targets no other job compiles — so it gets its own key.
      #
      # A PREFIX RESTORE IS SAFE HERE because the cache is content-addressed: an
      # entry keyed on a stale go.sum can only be a miss, never a wrong build.
      #
      # RESTORE AND SAVE ARE TWO STEPS, AND THE SPLIT IS THE POINT. A run restores
      # from its own branch or the default branch and from nothing else, and a pull
      # request's caches are scoped to `refs/pull/N/merge` — read by nobody but a
      # re-run of that same PR. A save made on a PR is therefore write-only: it
      # costs the runner the upload and takes room from the caches main reads. The
      # combined `actions/cache@v4` saves on every event; the pair below saves where
      # it can be read.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-targets-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-targets-${{ runner.os }}-
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      # Cross-compile the deployable binary for every release GOOS/GOARCH. The
      # binary is pure Go (CGO_ENABLED=0), so this needs no C toolchain. The
      # committed internal/web/dist/.gitkeep satisfies //go:embed all:dist, so no
      # SPA build is required just to confirm the Go binary links — the web job
      # covers the SPA build separately. Output is discarded (-o /dev/null); we
      # only care that each target compiles.
      #
      # NO `set -e`, AND THAT IS THE WHOLE POINT OF THE LOOP'S SHAPE: one target's
      # failure must not end the step for the others. `-u` and `pipefail` stay,
      # and the loop's own exit status is what the step reports.
      - name: cross-compile ./cmd/panel
        run: |
          set -uo pipefail
          failed=0
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64
          do
            goos=${target%%/*}
            goarch=${target##*/}
            if GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o /dev/null ./cmd/panel
            then
              echo "ok   $goos/$goarch"
            else
              echo "::error::./cmd/panel does not compile for $goos/$goarch"
              failed=1
            fi
          done
          exit "$failed"
      # SAVED ONLY FROM THE DEFAULT BRANCH, and only by a run that succeeded: a
      # key cannot be overwritten once written, so letting a partially populated
      # cache claim it would freeze the cache below what this job needs — for good.
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-targets-${{ runner.os }}-${{ hashFiles('go.sum') }}

  go_static:
    name: go (static checks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # THE BUILD CACHE KEY NAMES THE TOOLS THIS JOB COMPILES, AT THEIR PINS. A key is
      # written once, so keyed on go.sum alone the entry is the one main saved after
      # go.sum last moved, and no later save can add to it: staticcheck, added after
      # that save, would compile from source on every run until go.sum next changed.
      # With the pins in the key, adding or bumping a tool moves it, and the next main
      # push saves a cache that holds the build. The deploy guard reads the pins off
      # the steps below, so a bump that forgets the key fails there.
      #
      # The build cache pair the build job explains: restored on every event, and
      # saved only from the default branch, where a save can be read.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-static-${{ runner.os }}-${{ hashFiles('go.sum') }}-staticcheck-v0.8.1-govulncheck-v1.8.0
          restore-keys: go-build-static-${{ runner.os }}-
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      # THE FORMAT GATE IS HERE BECAUSE ITS ABSENCE COST TIME TWICE. This repository
      # had no format check at all — its whole static surface was `go vet` — so a
      # file that `gofmt -w` would change passed every gate here and failed in the
      # Node project's CI instead, on a change that had already been pushed. The two
      # repositories are edited by the same hands, and a check one of them runs is
      # not a check the other can skip.
      #
      # It is a `test -z` rather than a `gofmt -d` so the failure names the files and
      # exits non-zero in one line, the same shape the Node project uses.
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # THE REINSTALL ACCEPTANCE IS BEHIND A BUILD TAG, SO THE LINE ABOVE NEVER OPENS
      # IT. Its only compile was node-reinstall-acceptance.yml, which runs on a path
      # filter, and the case imports fifteen of this repository's packages of which the
      # filter covers six whole. #231 changed six files in the other nine and started
      # the acceptance only because it also happened to add a test under nodesync. A
      # signature change there without that luck merges green, and the broken compile
      # surfaces on the next PR that touches a listed path — blamed on that PR.
      #
      # Vetted here it no longer depends on the filter being complete. The dependencies
      # are already compiled by the line above, but the tag is part of vet's cache key:
      # measured locally this is ~11s until the build cache key above next moves and
      # main saves a cache that has seen it, and under a second after.
      - name: The tagged reinstall acceptance still compiles
        run: go vet -tags node_reinstall_acceptance ./tests/acceptance/...
      # STATICCHECK, BECAUSE VET DOES NOT LOOK FOR WHAT IT FINDS. Its first run here
      # reported thirteen findings every gate above had passed, among them six pieces
      # of dead code, a dead store in nodesync, a crypto/ecdsa field deprecated since
      # Go 1.26, and an alert source the router wires in and nothing lists. The CHANGELOG
      # records one manual U1000 sweep; this makes the sweep continuous. It runs with
      # the acceptance tag because a tag only adds files, so one pass reads them all.
      #
      # THE PIN HAS TO UNDERSTAND go.mod'S TOOLCHAIN, SO THE TWO MOVE TOGETHER.
      # staticcheck reads the compiler's export data, and a release older than the
      # toolchain cannot: v0.7.0 fails on go1.27.1 with "export data version 4 is
      # greater than maximum supported version 2", and v0.8.1 works. A toolchain bump
      # that turns this step red is asking for the staticcheck bump in the same PR.
      #
      # ~18s on a cold analysis cache, measured locally, in a job off the critical path.
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 -tags node_reinstall_acceptance ./...
      - name: Reachable vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # The race suite is sharded because it is the critical path: at 4m22s it was
  # still running while the other twenty-two checks had finished.
  #
  # THREE SHARDS, NOT FOUR, AND THAT NUMBER IS ARITHMETIC RATHER THAN TASTE. A
  # shard is one runner slot, so the right count is the smallest that keeps the
  # lane off this run's critical path — which is `web`, at 185s. Measured with a
  # warm build cache: four shards at 80-114s each, so the work is about 220s of
  # test time plus ~40s of per-shard overhead. Three shards put that at ~115s,
  # comfortably under the bound, and two would put it at ~150s, which is close
  # enough to `web`'s worst measured 185s that a slow frontend run would make the
  # race lane the thing everyone waits for again. The fourth shard was buying
  # parallelism nobody was waiting for.
  #
  # THE SHARDS COMPUTE THEIR OWN PACKAGES from a deterministic planner, so the
  # matrix carries only the shard number. Putting the package list in the matrix
  # would put it in the job name as well — GitHub appends every matrix value —
  # and the check would read "go race full (1/3, <eighty package paths>)".
  #
  # `sqlite (full suite, race)` keeps its name and becomes a gate over them.
  # Branch protection requires that exact context, and a matrix reports as
  # several checks, so a split that renamed the job would leave the required
  # context unproduced and block every merge on main.
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-static-${{ runner.os }}-${{ hashFiles('go.sum') }}-staticcheck-v0.8.1-govulncheck-v1.8.0
  race-shard:
    name: go race full (${{ matrix.part }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # A failing shard must not cancel its siblings: the reason to shard is to
      # see every failure in one run, and fail-fast would hide the rest.
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      # The same build cache pair the build job uses, keyed per shard: each shard
      # compiles a different set of packages under -race, and a key cannot be
      # overwritten, so one shared key would freeze whichever shard finished first.
      # See the build job for the measurement and for why restore and save are two
      # steps.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-race-${{ matrix.part }}-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-race-${{ matrix.part }}-${{ runner.os }}-
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      - name: test
        run: |
          # `set -e` IS PART OF THE GUARD BELOW, not just hygiene: without it
          # `test -n "$packages"` does not stop anything, and an empty planner
          # result reaches `go test` with no arguments — which tests the
          # repository root and reports "no Go files in ...", naming the symptom
          # rather than the cause.
          set -euo pipefail
          # ONE PACKAGE IS HALF THIS SUITE, AND PACKAGES CANNOT BALANCE IT.
          #
          # internal/adapters/sqlstore is 174s of the roughly 320s the weights file
          # records, so longest-processing-time packing gives it a shard to itself
          # and fills the other three with everything else. Measured on main: shard
          # 1 took 229s of test time while its siblings took 93s, 145s and 114s, so
          # the whole run waited on one package that no arrangement of PACKAGES can
          # shorten — it is longer than a quarter of the suite.
          #
          # So its TESTS are partitioned instead: round-robin over the list
          # `go test -list` prints. Round-robin needs no weights and maintains
          # itself — a test added tomorrow lands in exactly one shard — and with 315
          # of them the spread is what a weight table could not buy.
          #
          # THE PACKAGE IS TAKEN OUT OF THE PARTITION AND RUN HERE, and both places
          # that name it read one variable, so the two halves cannot overlap.
          heavy=github.com/KazuhaHub/passwall-sub-panel/internal/adapters/sqlstore
          packages=$(.github/scripts/plan-race-shards.sh \
            --shards 3 --shard "${{ matrix.part }}" --exclude "$heavy" \
            --default 1 --weights .github/race-shard-weights.txt)
          test -n "$packages"
          # A `-run` THAT MATCHES NOTHING IS A PASS — that is the failure this
          # guards against, and it is the one this job cannot see for itself: a
          # shard that ran no test of the heavy package looks exactly like a shard
          # whose slice was small. The list is checked before it is turned into a
          # pattern, and the pattern is checked before it is used.
          tests=$(go test -list '^Test' "$heavy" | grep '^Test' | grep -v '^TestMain$')
          test -n "$tests"
          regex=$(printf '%s\n' "$tests" \
            | awk -v s="${{ matrix.part }}" -v m=3 'NR % m == s % m' \
            | paste -sd'|' -)
          test -n "$regex"
          # Still one canonical full-suite race run: the shards partition the same
          # package set and the heavy package's tests partition the same test set,
          # so every package and every test in it runs exactly once.
          # PostgreSQL/MySQL below focus on dialect correctness without multiplying
          # race-detector runtime. Both invocations run — a failure in the first
          # must not hide whether the second would have passed as well.
          #
          # EACH PIPELINE ASSIGNS ITS OWN VERDICT, rather than a group whose status
          # is checked at the end: a `{ … } | tee` puts the group in a subshell, so
          # a `failed=1` set inside it is discarded and the step reports success
          # while a suite failed. shellcheck found exactly that here (SC2030/SC2031),
          # and it is the failure this job is least able to see for itself.
          failed=0
          go test -race -count=1 -timeout=8m $packages 2>&1 | tee test-output.txt || failed=1
          go test -race -count=1 -timeout=8m -run "^(${regex})$" "$heavy" 2>&1 | tee -a test-output.txt || failed=1
          exit "$failed"
      - name: upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: race-shard-${{ matrix.part }}-test-output
          path: test-output.txt
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-race-${{ matrix.part }}-${{ runner.os }}-${{ hashFiles('go.sum') }}

  sqlite:
    name: sqlite (full suite, race)
    needs: race-shard
    # always() so a failed, cancelled or never-planned shard still produces a
    # verdict here. A skipped gate would report as a missing required check,
    # which reads as "not run" rather than "failed".
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: every shard passed
        run: test "${{ needs.race-shard.result }}" = success

  postgres:
    name: postgres (sqlstore dialect)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: psp
          POSTGRES_PASSWORD: psp
          POSTGRES_DB: psptest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psp -d psptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PSP_TEST_DB_KIND: postgres
      PSP_TEST_DB_DSN: postgres://psp:psp@localhost:5432/psptest?sslmode=disable
      PSP_TEST_DB_REUSE_SCHEMA: "true"
    steps:
      - uses: actions/checkout@v7
      # The build cache pair the build job explains: restored on every event, and
      # saved only from the default branch, where a save can be read.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-postgres-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-postgres-${{ runner.os }}-
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      # THE SERVER IS THROWAWAY, SO IT DOES NOT SYNC TO DISK. The fixture was already
      # rebuilt around this cost — DROP DATABASE forced a checkpoint that "made the
      # schema-heavy CI suite spend minutes syncing disposable data" (testdb_test.go) —
      # and every reset is still a TRUNCATE ... CASCADE that flushes WAL on commit. No
      # test asserts crash durability, and a service container that dies takes its data
      # with it whatever these say. All three are reloadable; psp is the superuser.
      #
      # AN EXPERIMENT, MEASURED ONCE. Locally on PostgreSQL 16 it took this step's
      # command from 94-96s to 64s. What it has to move here is a test-step p50 of
      # 122s, with eleven of ninety-two runs over 150s and one at 458s against the 8m
      # timeout: compare p50 and p90 over ~20 runs before calling it a saving. The
      # -timeout stays as it is either way.
      - name: the throwaway server does not sync to disk
        env:
          SERVICE: ${{ job.services.postgres.id }}
        run: |
          docker exec "$SERVICE" psql -U psp -d psptest -v ON_ERROR_STOP=1 \
            -c 'ALTER SYSTEM SET fsync = off' \
            -c 'ALTER SYSTEM SET synchronous_commit = off' \
            -c 'ALTER SYSTEM SET full_page_writes = off' \
            -c 'SELECT pg_reload_conf()'
      # THE ROLLUP RUNS HERE TOO, because it is the one package outside sqlstore that
      # writes dialect-specific SQL: its hourly upsert branches on MySQL, after an empty
      # ON DUPLICATE KEY UPDATE failed in production, and SQLite alone had executed it.
      # Its tests read the same PSP_TEST_DB_* variables and take a fresh schema each.
      # Measured locally on PostgreSQL 16 and MySQL 8.0: 5s and 12s, in a binary go
      # test runs alongside sqlstore's 96s and 63s, so the step takes no longer. With
      # the old MySQL branch put back, they fail with the production 1064.
      - name: test
        run: |
          set -o pipefail
          go test -count=1 -timeout=8m ./internal/adapters/sqlstore/... ./internal/service/rollup/... 2>&1 | tee test-output.txt
      - name: upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-test-output
          path: test-output.txt
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-postgres-${{ runner.os }}-${{ hashFiles('go.sum') }}

  mysql:
    name: mysql (sqlstore dialect)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: psp
          MYSQL_DATABASE: psptest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ppsp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      PSP_TEST_DB_KIND: mysql
      # {schema} is substituted by the test database fixture.
      PSP_TEST_DB_DSN: root:psp@tcp(127.0.0.1:3306)/{schema}?parseTime=true&multiStatements=true
      PSP_TEST_DB_REUSE_SCHEMA: "true"
    steps:
      - uses: actions/checkout@v7
      # The build cache pair the build job explains: restored on every event, and
      # saved only from the default branch, where a save can be read.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/go-build
          key: go-build-mysql-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-mysql-${{ runner.os }}-
      - uses: actions/setup-go@v7
        # Allow toolchain selection; setup-go exports local after installation.
        env:
          GOTOOLCHAIN: auto
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact preferred compiler
        run: |
          set -eu
          build_toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          test -n "$build_toolchain"
          test "$(go env GOVERSION)" = "$build_toolchain"
          test "$(go tool compile -V | awk '{ print $3 }')" = "$build_toolchain"
      # The postgres job's experiment, for InnoDB: the redo log is flushed about once a
      # second instead of at every commit, and the binlog whenever the OS gets to it.
      # Both are dynamic globals. Locally on MySQL 8.0 it took this step's
      # command from 58-63s to 48s; here the test step's p50 is 90s with one run at
      # 372s, so it is the tail over ~20 runs that says whether it worked.
      - name: the throwaway server does not flush every commit
        env:
          SERVICE: ${{ job.services.mysql.id }}
        run: |
          docker exec "$SERVICE" mysql -uroot -ppsp \
            -e 'SET GLOBAL innodb_flush_log_at_trx_commit = 0; SET GLOBAL sync_binlog = 0'
      # The rollup's tests run here as well; the postgres job says why.
      - name: test
        run: |
          set -o pipefail
          go test -count=1 -timeout=8m ./internal/adapters/sqlstore/... ./internal/service/rollup/... 2>&1 | tee test-output.txt
      - name: upload test output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mysql-test-output
          path: test-output.txt
      - uses: actions/cache/save@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/go-build
          key: go-build-mysql-${{ runner.os }}-${{ hashFiles('go.sum') }}
