# Sample Nginx reverse proxy for Passwall-Sub-Panel.
# Drop into /etc/nginx/conf.d/ (or sites-available/) and reload.

upstream psp_backend {
    server 127.0.0.1:8788;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name sub.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sub.example.com;

    # Replace with paths to your real cert/key, e.g. from certbot.
    ssl_certificate     /etc/letsencrypt/live/sub.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # gzip for the SPA's JS/CSS/JSON and subscription YAML. Clients send
    # Accept-Encoding for sub fetches too, so compressing them shaves a
    # real chunk off cellular refreshes.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    # Each type below is one the panel really emits (text/html is always
    # compressed by nginx, so it is not listed). A Go test
    # (handler/nginx_gzip_types_test.go) fails if one of them is missing here.
    gzip_types
        # SPA JS: Go's mime.TypeByExtension(".js") gives text/javascript.
        text/javascript
        # Same type under its older name, for a host mime table that returns it.
        application/javascript
        # SPA CSS.
        text/css
        # /sub for Mihomo/Clash (render.go) and the URI-list (base64 text).
        text/yaml
        text/plain
        # /sub for sing-box, every /api response, and the SPA's .json files.
        application/json
        # SPA .svg assets (fonts and images are already compressed formats).
        image/svg+xml
        # Legacy aliases, harmless if never sent.
        text/x-yaml
        application/yaml
        application/x-yaml
        application/xml;

    # Reasonable client body limit; SAML POST + admin actions are tiny.
    client_max_body_size 1m;

    # Passwall Node reports. A full report lists every client on the node
    # (about 220 bytes each, so 1 MiB is only some 4.8k clients), and a node
    # starts every run sending plain until the panel's first answer offers
    # gzip: a smaller limit here refuses that first report and the node never
    # syncs. 16m is the protocol's wire limit, which the panel enforces itself.
    # The pattern also matches the path under a runtime panel_path (nodes are
    # given /panel/v1/node/sync when panel_path is /panel).
    location ~ /v1/node/sync$ {
        client_max_body_size 16m;
        proxy_pass http://psp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        # Request buffering stays on: nginx takes the report at the node's
        # upload speed and hands it to the panel over loopback at once. Streamed
        # through, a large report on a slow link would run into the panel's
        # 30-second read timeout.
    }

    # Rule-set editor. A rule set travels as one YAML string inside a JSON body
    # (PUT /api/admin/rules/<slug>, POST .../inspect-proxy-groups and
    # .../preview-proxy-groups), and large community lists pass the 1m default,
    # in which case nginx would refuse the request itself with an HTML 413 the
    # editor cannot read. 8m is the limit the panel enforces on the same
    # endpoints (it answers 413 JSON, code body_too_large, past it), so nginx
    # and the panel agree. The pattern is unanchored on purpose so it also
    # matches under a runtime panel_path (/panel/api/admin/rules/x); a regex
    # location is chosen over the plain "location /" below, and it cannot catch
    # the SPA or its assets, whose paths never contain /api/admin/rules/. Keep
    # request buffering on, as for node sync: nginx takes the upload at the
    # client's speed, then hands it to the panel over loopback at once.
    location ~ /api/admin/rules/ {
        client_max_body_size 8m;
        proxy_pass http://psp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    # Cache headers for the SPA are driven by the backend — /assets/* is
    # served with `Cache-Control: immutable` (hashed filenames) and
    # index.html with `Cache-Control: no-cache`. Don't override here.

    # Anything (admin SPA, /api, /sub, SAML ACS) goes to psp. When the
    # runtime panel_path setting is /panel, keep forwarding /panel/ unchanged:
    # PSP strips that prefix itself. Do not add a proxy rewrite.
    location / {
        proxy_pass http://psp_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        # Since this nginx is the only thing in front of psp (upstream
        # 127.0.0.1:8788), set `http.trusted_proxies: "127.0.0.1,::1"` in
        # config.yaml (or PSP_TRUSTED_PROXIES). The panel then trusts the
        # X-Forwarded-For above only from this proxy, so a client hitting
        # 8788 directly can't forge it to spoof their IP past the rate limiter.
        # Subscription render for a user with many nodes + a regenerated
        # rule_set can serialise into a 500 KB+ blob. 5 min is a safety
        # net — typical sub fetch is single-digit seconds.
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
        # SAML ACS POST carries a SAMLResponse the IdP signed; don't
        # spool it through nginx, send straight to the upstream.
        proxy_request_buffering off;
    }
}
